# OpenGantry mission (Planner-stamped by [MSN-0263]). CI installs the iii example's deps before verifying missions.
#
# Legislated intent: mission_verify (gxt-validate.yml) and attest_ingest (gxt-attest-ingest.yml) gain an
# `npm ci` step in examples/iii-integration before they run `gantry verify`, so an iii-integration mission's
# gate (validate-offline.mjs, which needs the example's own acorn-walk) can run in CI instead of exiting 2.
# PR #207 (MSN-0262) failed exactly there and had to re-legislate its gate to self-install.
#
# Scope widened on purpose (same files, same cause): both workflows are shipped to adopters by gantry init and
# gantry upgrade from templates/.github/workflows/ (managed_strict; mirrored to .github/ by gen:dogfood), and
# the template's existing `iii integration offline validate` step in the manifest job runs unconditionally,
# so an adopter's CI without examples/iii-integration fails at `cd examples/iii-integration`. Every iii example
# step in both templates becomes conditional on examples/iii-integration/package-lock.json existing.
#
# DoD 1 (templates): templates/.github/workflows/gxt-validate.yml: the manifest job's iii step and a new
#        mission_verify step `Install iii integration example deps` (npm ci in examples/iii-integration, before
#        `Full verify on PR-changed missions`) both run only if hashFiles('examples/iii-integration/package-lock.json')
#        is non-empty; templates/.github/workflows/gxt-attest-ingest.yml gains the same guarded install step
#        before `Verify and export envelope` (also only when a mission was resolved). No other step changes.
# DoD 2 (mirrors): npm run gen:dogfood copies both templates to .github/workflows/ byte for byte;
#        assert-dogfood-sync passes.
# DoD 3 (tests): src/cli/tests/ci-iii-example-install.test.ts parses both templates and their mirrors: every
#        step that touches examples/iii-integration carries the hashFiles guard, the install steps precede the
#        verify steps, and the mirrors equal the templates.
# DoD 4 (docs): docs/DEVELOPMENT.md CI table notes the install for mission_verify; docs/CHANGELOG.md gains an
#        Unreleased entry and upgrade note (gantry upgrade brings the guarded steps; adopters' CI no longer runs
#        the iii example steps).
# DoD 5 (gate): `./scripts/dev-validate-core.sh` passes (dev-validate-core OK).
#
# Limit: this PR's own CI verifies only MSN-0263 (substrate gate), so it cannot run an iii-integration gate;
# the proof is the structural test plus a local run of the plain gate after `npm ci` in the example.
