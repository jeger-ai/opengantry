# OpenGantry mission scaffold (Planner: fill gate, TMVC narrowing, trace rows).
# Legislated by Planner stamp [MSN-0290]. Executor must not run until the [MSN-0290] legislation commit + pin.
#
# Legislated intent: ADR-0052 migration step 5b-ii (A8, runtime helpers call the CLI). scripts/gxt-resolve-mission.sh,
# gxt-pin-mission.sh and the deprecated gxt-cursor-env.sh are deleted with their templates; gantry pin and gantry
# runtime env do their work (explicit path, GANTRY_MISSION, GXT_MISSION_FILE, the pin file, legacy ACTIVE_MISSION
# files); scripts/gxt-runtime-env.sh is a thin wrapper that evals gantry runtime env and stops on failure whether
# sourced or run; the Cursor session hook reads gantry runtime env --json and reports no pin when it fails; the init
# catalog no longer ships the three scripts, so the init goldens are re-recorded; the duplicate rule's allowed list
# drops three pairs; CLI hints, the MCP tool description, docs, rules and the PR template say gantry pin.
#
# Operator direction (2026-10-18, "merge and continue until everything is done"): gxt-runtime-env.sh and
# gxt-shell-agent.sh stay because a sourced shell helper cannot be a CLI call. No trace rows: the evidence is
# .gitagent/runs/MSN-0290.json written by gantry verify --record (RULES §3).
#
# DoD 1 (removal): scripts/gxt-resolve-mission.sh, scripts/gxt-pin-mission.sh, scripts/gxt-cursor-env.sh and their
#        templates/scripts copies are deleted; scripts/lib/asset-catalog-static.mjs and templates/integrations/
#        asset-catalog.json no longer list them; TARGET_ARCHITECTURE.yaml's duplicate rule drops the three pairs;
#        no file in the repository names them (goldens, archive and logs excepted).
# DoD 2 (wrapper): templates/scripts/gxt-runtime-env.sh (synced to scripts/) resolves gantry (PATH, then dist),
#        runs gantry runtime env with an optional --mission and evals its output; on failure it prints the pin hint
#        and returns 1 when sourced or exits 1 when run; sourced with a real mission it exports GXT_MISSION_FILE and
#        GXT_SKILL_KEY.
# DoD 3 (session hook): .cursor/hooks/gxt-session-start.sh and templates/.cursor/hooks/gxt-session-start.sh are
#        identical; without a pin the hook emits the "No active mission pinned" context; with GANTRY_MISSION or a pin
#        it emits env plus the mission context from gantry runtime env --json.
# DoD 4 (CLI strings): context-request.ts, audience-output.ts, start-orchestration.ts and the gxt_resolve_mission
#        description in mcp-tools-register.ts say gantry pin; gantry arch check (whole tree) passes.
# DoD 5 (docs, law): docs/DEVELOPMENT.md, docs/guides/agents.md, docs/reference/mcp-tools.md,
#        docs/reference/session-variables.md, .gitagent/planner/MISSION-ARCHITECT.md and its template, the Cursor
#        rules and their template, templates/.gitagent/planner/AGENT-SETUP.md, .github/PULL_REQUEST_TEMPLATE.md,
#        docs/CHANGELOG.md.
# DoD 6 (tests, dogfood): all unit tests pass; conformance passes with the two init goldens re-recorded and no other
#        golden changed; this mission is verified by its committed run record; ./scripts/dev-validate-core.sh passes;
#        git diff --name-only origin/main...HEAD lists only paths under contract.tmvc_roots.
