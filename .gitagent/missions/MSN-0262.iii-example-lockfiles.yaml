# OpenGantry mission (Planner-stamped by [MSN-0262]). Refresh the iii integration example lockfiles.
#
# Legislated intent: clear the 14 open Dependabot alerts, all in the iii integration example (not in either
# published package; npm audit --omit=dev on both is clean): critical proxy-addr, high
# @opentelemetry/propagator-jaeger, and hono, ip-address, qs, brace-expansion, @opentelemetry/core.
#   - examples/iii-integration: every finding has an in-range fix, so this is a lockfile refresh.
#   - workers/session-auth: most findings are in range; @iii-dev/helpers, @opentelemetry/core and iii-sdk
#     itself need iii-sdk ^0.24.5 (npm flags it major because 0.x minors are breaking). The example already
#     runs on the 0.24 line (^0.24.4 since MSN-0249). The worker only uses registerWorker from iii-sdk.
#
# DoD 1 (example): examples/iii-integration/package-lock.json refreshed with in-range fixes only
#        (package.json unchanged unless npm requires it); `npm audit` there reports 0 vulnerabilities.
# DoD 2 (worker): workers/session-auth/package.json iii-sdk ^0.24.5 and its package-lock.json refreshed;
#        `npm audit` there reports 0 vulnerabilities; the installed iii-sdk still exports registerWorker;
#        the worker's own `npm test` (tests/admission.test.mjs) passes.
# DoD 3 (scope): the diff against main touches only the four contract files, the mission file and
#        EXECUTOR_LOG.md; no root package.json, package-lock.json, src/ or published-package change.
# DoD 4 (gate): `cd examples/iii-integration && npm ci --no-audit --no-fund && node scripts/validate-offline.mjs`
#        passes (offline validate OK). Re-legislated after PR #207's first CI run: the CI mission_verify job installs
#        only root deps, so the gate installs the example's own deps first, as the gxt-validate manifest job does.
#
# After merge: GitHub's Dependabot alerts for these manifests should close on their own; the mission
# records the audit result, not the alert count, which GitHub recomputes asynchronously.
