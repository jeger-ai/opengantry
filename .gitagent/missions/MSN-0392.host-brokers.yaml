# OpenGantry mission scaffold (Planner: fill gate, TMVC narrowing, trace rows).
# Legislated by Planner stamp [MSN-0392]. Executor must not run until the [MSN-0392] legislation commit + pin.
#
# Legislated intent: issue #356 Q7: the first typed host brokers in packages/missions/src/admission: a git.publish dispatcher that pushes
# one exact commit to a non-default, non-protected branch of the configured GitHub repository with --force-with-lease
# from a broker-private repository (alternates, clean env, hooks off), credentials scoped to that one command through
# GIT_CONFIG_COUNT, the result verified by ls-remote; a delivery.mutate dispatcher that creates one pull request through
# a small typed GitHub REST client, idempotent by an open-PR lookup for head and base; an unknown outcome reconciled by
# an explicit read (ls-remote or PR lookup) recorded as reconciled-confirmed or reconciled-failed, never by a second
# push or POST; a credential provider interface with a GitHub App installation-token provider (key file under the state
# dir, 0600, refused otherwise; token in memory only, short TTL, contents:write and pull_requests:write requested
# explicitly), a typed GitHub Actions OIDC stub that refuses as not implemented, and a test provider in tests only;
# tokens never in the journal, receipts, logs or argv; gantry cage policy adds sandbox.credentials.envVars deny for
# GH_TOKEN and GITHUB_TOKEN; gantry admission serve gains --host-config; offline tests with a local bare repo and a fake
# GitHub API; docs (ADR-0063 status, coverage B18, operator page for the GitHub App), changelog and release notes. Live
# proof against GitHub stays open until the owner creates the App.
#
# Operator brief (2026-11-17, orchestrator brief for issue #356, owner decision Q7; interrogation answers written by the agent from it).
# No trace rows: the evidence is .gitagent/runs/MSN-0392.json written by gantry verify --record (RULES §3).
msn_id: MSN-0392
skill_key: substrate
