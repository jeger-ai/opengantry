# OpenGantry mission scaffold (Planner: fill gate, TMVC narrowing, trace rows).
# Legislated by Planner stamp [MSN-0283]. Executor must not run until the [MSN-0283] legislation commit + pin.
#
# Legislated intent: ADR-0052 migration step 2b. The cage runtime moves from src/cli/lib/cage to packages/cage
# (private package, #cage/* imports) and imports only #core and #git. The path helpers toPosixRel, fromPosix,
# formatRepoRelative and repoAbsPath move to packages/core/src/posix-path.ts (cli-io re-exports them), so core may use
# node:path but still no fs, child_process, os, net or http. The slim @jeger-ai/opengantry-cage bundle moves to
# dist/packages/cage/src next to its dist/cli/index.js bin, and the push guard resolves the bin as
# ../../../cli/index.js from the cage module in both packages. CLI output unchanged, no new dependency.
#
# Operator direction (2026-10-18, "merge and continue until everything is done"): step 2b as ADR-0052 step 2
# requires; no barrel index.ts because two cage modules export the same names (per-module #cage imports).
#
# DoD 1 (package): packages/cage with package.json (private, no dependencies), tsconfig.json (composite, outDir
#        dist/packages/cage, paths for #core and #git, references core and git) and the 15 modules git mv'd from
#        src/cli/lib/cage (cage-check, cage-config, cage-journal, cage-process, cage-push-guard, cage-report,
#        cage-revert, cage-rules, cage-run, cage-scope, cage-snapshot, cage-suggest, cage-watch-decisions,
#        cage-watch-run, cage-watch); src/cli/lib/cage/ no longer exists; no cage module imports ../ or src/cli:
#        errors -> #core/user-error.js, git -> #git/git.js, constants -> #core/constants.js, manifest shape ->
#        #core/manifest.js (cage-rules reads MANIFEST.json itself and validates it), Manifest type ->
#        #core/manifest.js, toPosixRel -> #core/posix-path.js.
# DoD 2 (core): packages/core/src/posix-path.ts holds toPosixRel, fromPosix, formatRepoRelative and repoAbsPath
#        (moved from src/cli/lib/cli-io.ts, which re-exports them); core index exports it; core imports node:path
#        and nothing else from node:.
# DoD 3 (wiring): root package.json imports maps #cage/* to ./dist/packages/cage/src/*; tsconfig.json references
#        packages/cage; src/cli/commands/cage.ts and the seven cage tests import #cage/*; tests that spawn a child
#        importing the journal module use dist/packages/cage/src; prune-dist removes the old dist/cli/lib/cage files.
# DoD 4 (slim package): packages/opengantry-cage/build.mjs writes the bundle to dist/packages/cage/src/
#        opengantry-cage.js and the bin dist/cli/index.js imports ../packages/cage/src/opengantry-cage.js;
#        cage-push-guard.ts resolves the guard entry as ../../../cli/index.js; package-shape and size-budget tests
#        name the new bundle path; npm run build:cage and npm run test:cage pass (12 tests); the bundle stays under
#        the size budget and depends on commander only.
# DoD 5 (law): TARGET_ARCHITECTURE.yaml scan_roots add packages/cage/**, layer cage (packages/cage/src/**), rules
#        RULE-CAGE-NO-LIB-LAYER, RULE-CAGE-NO-COMMAND-LAYER, RULE-CAGE-NO-DELIVERY-LAYER; RULE-CORE-NO-NODE-IO is
#        replaced by RULE-CORE-NO-FS, RULE-CORE-NO-CHILD-PROCESS, RULE-CORE-NO-OS, RULE-CORE-NO-NET and
#        RULE-CORE-NO-HTTP; gantry arch check over src/cli and every package OK; ARCH_BASELINE.json regenerated
#        with a cage row and a smaller lib row, --check OK, byte-identical at its recorded commit.
# DoD 6 (behaviour): conformance suite 84 pass, 0 fail, 1 skipped, no golden file changed (the cage goldens
#        byte-identical); all unit tests pass; test:packages passes.
# DoD 7 (docs): docs/ARCHITECTURE.md cage row and import rules, docs/DEVELOPMENT.md package table,
#        docs/CHANGELOG.md substrate note and Unreleased bullet.
# DoD 8 (gate): ./scripts/dev-validate-core.sh passes (dev-validate-core OK); git diff --name-only origin/main...HEAD
#        lists only paths under contract.tmvc_roots.
