# Legislated intent: Release OpenGantry v3.8.0: record ADR-0048 cage trust model (built-in rules are a floor, .cage.yaml only adds, relaxation is the announced runtime flag --allow-override, rule authoring stays outside the agent loop), document .cage.yaml, --allow-override and gantry cage suggest in README, FEATURES, ADOPTION and CHANGELOG, and bump version parity to 3.8.0
