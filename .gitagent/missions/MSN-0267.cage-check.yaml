# OpenGantry mission scaffold (Planner: fill gate, TMVC narrowing, trace rows).
# Legislated by Planner stamp [MSN-0267]. Executor must not run until the [MSN-0267] legislation commit + pin.
#
# Legislated intent: make a diff check the primary form of gantry cage. Wrapping an agent session
# (`gantry-cage -- claude`) needs a per-session habit, cannot reach IDE, desktop or cloud agents, and competes with
# harness sandboxes that block before the write. Every agent's work passes through commits and the PR, so the cage
# rules run there: `gantry cage check` for pre-push and CI. The session wrapper stays for scripted headless runs.
#
# Constraints: ADR-0048 stays ACTIVE and unchanged. No MCP tool, no --allow-override, nothing new in the slim
# package bin (`gantry-cage` keeps no subcommands; packages/opengantry-cage/src/ is forbidden). No workflow and no
# adopter template: .github/workflows/ and templates/ are forbidden; the GitHub Actions snippet lives in docs only.
#
# DoD 1 (command): `gantry cage check --base <ref> [--head <ref>] [--json]` (head defaults to HEAD) lists the paths
#        changed by commits in base..head and classifies each with the cage rules. Range and rename-free name listing
#        are the session push guard's, shared code, not a copy. Exit 0 when no revert-rule path changed, 3 when one
#        did, 2 outside a git work tree, on a ref that does not resolve, or on an invalid .cage.yaml or MANIFEST.json
#        at base. Report-mode hits (lockfiles, .cage.yaml report entries) are listed and never change the exit code.
#        `gantry cage -- check` still runs a command named check.
# DoD 2 (rules from base): .cage.yaml and MANIFEST forbidden_zones are read from the base commit through git, never
#        from the working tree or head. A head that deletes .cage.yaml is still checked against base's entries, and
#        the deletion is reported under cage_config. Built-in rules apply unchanged. The session cage
#        (`gantry cage -- <cmd>`, `gantry-cage`) changes no rule, mode, cap or exit code.
# DoD 3 (output): human summary on stderr; `--json` emits `gantry.cage-check.v1` on stdout with base and head shas,
#        the commit the rules were read from, changes[] (path, rule, source, mode) and a status. Digest-only: no file
#        bodies, no diffs.
# DoD 4 (tests): new src/cli/tests/cage-check.test.ts over temp git repos: clean range exit 0; CI config, .env,
#        manifest forbidden zone and .cage.yaml protect entry changes exit 3 naming the rule; lockfile-only change
#        exit 0 and listed; head deleting .cage.yaml and touching a path base's entry protects exits 3; unresolvable
#        ref and invalid base .cage.yaml exit 2; .env committed then removed inside the range exits 3; `cage -- check`
#        runs a command. npm run test:cage (slim package) passes unchanged.
# DoD 5 (ADR): .gitagent/out-of-scope/ADR-0050-cage-diff-check.md, status ACTIVE: context (why session wrapping
#        will not be adopted), decision (check first, rules from base, history semantics, wrapper for scripted
#        headless runs, slim package unchanged pending the fold-back decision), consequences (a legitimate CI config
#        change fails the check and is resolved by human review; check is not an attestation receipt), follow-ups
#        (shipped CI template, pre-write harness hooks for Claude Code and Cursor, a mission clearing a protected-path
#        change). ADR-0048 stays ACTIVE.
# DoD 6 (docs): README "Try it in 60 seconds" leads with cage check, the session wrapper follows as the option for
#        scripted runs; ADOPTION step zero becomes cage check in CI with a GitHub Actions snippet (fetch-depth: 0,
#        base = the PR base sha); FEATURES cage section documents check (options, exit codes, JSON, rules from base,
#        limits); packages/opengantry-cage/README.md says check lives in the full package; CHANGELOG Unreleased entry.
# DoD 7 (gate): ./scripts/dev-validate-core.sh passes (dev-validate-core OK).
