interrogation:
  - finding_id: 2121e0ae69d9
    kind: adr_conflict
    question: Intent may relate to ADR-0037. Accept ADR decision, reject
      applicability, or cite superseding rationale?
    hypothesis: Operator explicitly accepts or rejects ADR ADR-0037 before
      legislation proceeds.
    operator_answer: Reject applicability; ADR-0037 stays ACTIVE and unchanged. It
      matched only on CI. gantry cage check is a local read-only command that
      adopters may call from their own CI; it emits no envelope or receipt,
      touches no control plane, ingestion workflow, pepper or attestation path,
      and this mission adds no workflow (.github/workflows/ and templates/ are
      forbidden). The GitHub Actions snippet lives in docs only.
    adr_refs:
      - ADR-0037
  - finding_id: 4367eadf9a61
    kind: adr_conflict
    question: Intent may relate to ADR-0048. Accept ADR decision, reject
      applicability, or cite superseding rationale?
    hypothesis: Operator explicitly accepts or rejects ADR ADR-0048 before
      legislation proceeds.
    operator_answer: "Accept; ADR-0048 stays ACTIVE and unchanged. cage check
      applies the same rules with the same trust model: built-in rules are the
      floor, .cage.yaml only adds, MANIFEST forbidden_zones are included, and
      both are read from the base commit, not the head under review, so a change
      cannot loosen the rules it is checked against (the floor-from-outside idea
      of decisions 1-2; a .cage.yaml edit is itself flagged by the built-in
      cage_config rule). check takes no --allow-override in this mission, so
      decision 3 has nothing to announce. Decision 4 holds: no MCP tool exposes
      check, and check never writes rules. The new ADR-0050 records the change
      in how cage is positioned (diff check first, session wrapper for scripted
      headless runs, pre-write harness hooks and a shipped CI template as
      follow-ups); it does not supersede ADR-0048."
    adr_refs:
      - ADR-0048
  - finding_id: a9421a4fe801
    kind: undefined_boundary
    question: Paths are not mapped to any TARGET_ARCHITECTURE layer (tier Tier-2).
      Confirm boundary for all listed paths.
    hypothesis: Operator authorizes work within declared TMVC and documents boundary
      decision on the record.
    operator_answer: Confirmed. src/cli/program-cage.ts is the cage command
      registration module, one of the src/cli/program-*.ts files that none of
      the TARGET_ARCHITECTURE layers map; it only wires commander options to
      src/cli/commands/cage.ts. src/cli/tests/cage-check.test.ts (new) and
      src/cli/tests/cage.test.ts hold tests only and may import the cage library
      they exercise. No production logic goes into these paths beyond command
      wiring.
