# rules at base and cage scope, the CI MSN range, trusted automation, mission discovery, verify checks and the ledger
# chain. A spawnSync test seam in the git adapter; tests first, each failing on main. packages/verify/src/dependencies.ts
# is left to open PR #372 (MSN-0388).
