# OpenGantry mission scaffold (Planner: fill gate, TMVC narrowing, trace rows).
# Legislated by Planner stamp [MSN-0394]. Executor must not run until the [MSN-0394] legislation commit + pin.
#
# Legislated intent: issue #356, the agent reaches the admission broker without any Unix socket reachable from the
# sandbox (owner decision 2026-11-17). Investigated first: no inherited fd reaches a sandboxed command (srt passes only
# stdio; Node marks inherited fds close-on-exec at startup) or a Claude Code MCP server, so per the brief fallback the
# relay goes through gantry MCP server, which runs outside the sandbox. A gxt_admission_request MCP tool forwards one
# broker message (prepare, dispatch, capabilities) to the socket named by GANTRY_BROKER_SOCKET and returns the broker
# answer verbatim; the broker framing, bounds, deadline, denial budget and journal-before-effect are unchanged. A hidden
# gantry admission launch -- <harness> starts a session broker, exports GANTRY_BROKER_SOCKET to the harness and stops
# the broker when the harness exits. Sandboxed shell commands get no broker access. Host canaries: an inherited fd is
# dropped by a Node intermediary and by srt; under the srt-equivalent seccomp filter (bwrap --seccomp) and under full
# srt policy mode (skipped with its reason until the AppArmor profile is present) a sandboxed process cannot connect to
# the broker socket by path. Loopback TCP through the srt proxy is recorded in ADR-0063 as an option, not built. Tests
# first; no cell becomes prevention.
#
# Operator brief (2026-11-17, orchestrator brief for MSN-0394 and its follow-up choosing the MCP relay fallback;
# interrogation answers written by the agent from it).
# No trace rows: the evidence is .gitagent/runs/MSN-0394.json written by gantry verify --record (RULES §3).
msn_id: MSN-0394
skill_key: substrate
