#        start (exit 2) instead of "larger files are detect-only"; `gantry cage --help` and the standalone
#        `opengantry-cage --help` show the new text and no "detect-only".
# DoD 2 (comment): src/cli/lib/cage/cage-revert.ts documents `detect_only` as no longer produced for
#        revert-rule files since MSN-0254 (kept in CageOutcome for gantry.cage-report.v1 compatibility).
# DoD 3 (FEATURES): the Zero-config cage section in docs/FEATURES.md gains a signals bullet (SIGTERM, SIGHUP
#        and a non-interactive SIGINT terminate the enumerated tree, then restore; interactive Ctrl-C left to
#        the agent; `trapped_signal` in the report) and a journal bullet (location under the git dir, kill -9
#        recovery before the next run, GXT_CAGE_SESSION_ACTIVE and GXT_CAGE_JOURNAL_CORRUPT exit 2, `recovery`
#        in the report); exit codes and report fields match. assert-docs-deterministic OK.
# DoD 4 (CHANGELOG): docs/CHANGELOG.md gains an **Unreleased** release-highlights row naming MSN-0250,
#        MSN-0252, MSN-0253 and MSN-0254, and an upgrade-notes subsection for the two behaviour changes
#        (wrapper signals now terminate the tree; over-cap or over-budget protected files now exit 2 instead
#        of detect_only). No version bump: that is a separate release mission.
# DoD 5 (gate): `./scripts/dev-validate-core.sh` passes (dev-validate-core OK).
