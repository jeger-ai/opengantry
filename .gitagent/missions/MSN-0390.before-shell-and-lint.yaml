# location as the checkout when the IDE names another project directory (both are inside), drops the
# CLAUDE_PROJECT_DIR fallback, replaces its grep pipes with bash regex tests, and answers ask on any failure.
#
# Operator brief (2026-11-17). No trace rows: the evidence is .gitagent/runs/MSN-0390.json written by
