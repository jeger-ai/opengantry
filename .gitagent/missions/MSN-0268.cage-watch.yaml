  - finding_id: 2121e0ae69d9
    kind: adr_conflict
    question: Intent may relate to ADR-0037. Accept ADR decision, reject
      applicability, or cite superseding rationale?
    hypothesis: Operator explicitly accepts or rejects ADR ADR-0037 before
      legislation proceeds.
    operator_answer: Reject applicability; ADR-0037 stays ACTIVE and unchanged. It
      matched on a substring (CI); gantry cage watch is a local foreground
      command in the operator's terminal. It emits no envelope or receipt and
      touches no control plane, ingestion workflow, pepper or attestation path;
      this mission adds no workflow (.github/workflows/ and templates/ are
      forbidden).
    adr_refs:
      - ADR-0037
  - finding_id: 4367eadf9a61
    kind: adr_conflict
    question: Intent may relate to ADR-0048. Accept ADR decision, reject
      applicability, or cite superseding rationale?
    hypothesis: Operator explicitly accepts or rejects ADR ADR-0048 before
      legislation proceeds.
    operator_answer: "Accept; ADR-0048 stays ACTIVE and unchanged. gantry cage watch
      uses the same rules (built-in floor, additive .cage.yaml, manifest zones)
      read from the working tree at start, and the plan stays the one the watch
      started with (decision 5), so an accepted .cage.yaml edit changes no rule
      until a new watch starts. Accept is not a relaxation of a rule: it is a
      per-change decision by the operator, answered only on the watch process's
      own terminal stdin (no command, file, socket or MCP tool an agent could
      use; decision 4), bound to the sha256 of the content shown, recorded in
      the session log and the exit report; unanswered changes are rejected after
      the decision timeout (default 20 seconds). Reject, timeout and shutdown
      restore from the baseline as the session cage does. --allow-override is
      not offered on watch. ADR-0050 is amended to record watch as the local
      complement of cage check."
    adr_refs:
      - ADR-0048
      - ADR-0050
