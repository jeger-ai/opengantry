# OpenGantry mission scaffold (Planner: fill gate, TMVC narrowing, trace rows).
# Legislated by Planner stamp [MSN-0268]. Executor must not run until the [MSN-0268] legislation commit + pin.
#
# Legislated intent: gantry cage watch. cage check (MSN-0267) sees committed history only; a gitignored .env,
# .git/config and .git/hooks never reach a commit, so their tampering is invisible to it. Watch covers files on disk
# without wrapping the agent, so it reaches IDE, desktop and cloud-synced agents alike. It cannot tell which process
# wrote a file, so every protected change is a human-in-the-loop decision: notify, the operator accepts or rejects,
# no answer within the timeout rejects. Stacked on msn-0267-cage-check (ADR-0050 and the cage docs live there).
#
# Constraints: ADR-0048 stays ACTIVE and unchanged; the watch plan is the one it started with (decision 5). Answers
# come only from the watch process's own terminal stdin: no command, file, socket, signal or MCP tool can accept.
# No --allow-override, no halt, no push guard. Full package only (packages/opengantry-cage/src/ is forbidden).
#
# DoD 1 (command): `gantry cage watch [--decision-timeout <seconds>] [--watch-interval-ms <n>] [--max-file-bytes <n>]
#        [--json]` runs in the foreground until Ctrl-C/SIGTERM; default decision timeout 20 seconds. Root, rules and
#        baseline as the session cage (working tree, gitignored files included, fail-closed caps). Exit 2 before
#        watching when stdin is not a TTY (GXT_CAGE_WATCH_NO_TTY), while a session cage or another watch is active
#        in the root (GXT_CAGE_SESSION_ACTIVE), or on invalid rules or caps. `gantry cage -- watch` still runs a
#        command named watch; the slim gantry-cage bin gains no subcommand.
# DoD 2 (decisions): each revert-rule change becomes a pending decision: terminal bell, a prompt on the watch
#        terminal (path, rule, kind, short sha256, seconds left) and a best-effort desktop notification (notify-send on
#        Linux, osascript on macOS; failure ignored) naming path and rule only. `a` accepts, `r` rejects, read only
#        from the watch process's stdin. Accept keeps the change and re-baselines that path only if its current sha256
#        equals the one prompted; otherwise it is a new decision. Reject and timeout restore from the baseline. A
#        rewrite while pending never extends the deadline. A path rejected or timed out 3 times is restored at once
#        without a prompt for the rest of the session and announced. Report-mode changes are logged, never prompted.
# DoD 3 (shutdown/report): Ctrl-C or SIGTERM rejects every pending decision, restores the protected set once more
#        and prints a summary; exit 3 when any change was rejected, timed out or auto-restored, otherwise 0. A JSONL
#        session log records detected, accepted, rejected, timed_out and auto_restored events without file bodies;
#        --json emits gantry.cage-watch.v1 (digest-only). A kill -9 on watch leaves a journal the next cage or watch
#        run recovers from: baseline incl. accepted changes restored, no process killed.
# DoD 4 (tests): new src/cli/tests/cage-watch-decisions.test.ts drives the watch loop with injected input stream,
#        clock and notifier: accept, reject, timeout; accept after the content changed is refused and re-prompted;
#        rewrite does not extend the deadline; third rejection auto-restores; lockfile logged without prompt; non-TTY
#        stdin and an active session exit 2; shutdown rejects pending; notifications and reports carry no file
#        bytes; kill -9 recovery restores and kills nothing. Existing cage suites and npm run test:cage pass.
# DoD 5 (ADR): ADR-0050 amended: check (commits) and watch (files on disk) are the two primary forms; watch
#        decision rules (terminal-only answers, hash-bound accept, default 20 s auto-reject, prompt-spam limit);
#        limits (no process identity, so no halt and no push guard; reads not prevented; a same-user agent can kill
#        the watch, the next run recovers from the journal; the change is live while its decision is pending).
# DoD 6 (docs): README cage section, ADOPTION step zero (check in CI plus watch locally), a FEATURES watch section,
#        the slim README pointer and a CHANGELOG Unreleased entry.
# DoD 7 (gate): ./scripts/dev-validate-core.sh passes (dev-validate-core OK).
