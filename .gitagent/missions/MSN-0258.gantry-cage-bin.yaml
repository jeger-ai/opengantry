# OpenGantry mission (Planner-stamped by [MSN-0258]). Rename the standalone cage bin to gantry-cage.
#
# Legislated intent: the full package adds gantry-cage and keeps opengantry-cage as a silent legacy alias
# (like gapman); the slim @jeger-ai/opengantry-cage package exposes only gantry-cage; help and version say
# gantry-cage; tests, README, ADOPTION, FEATURES, the slim README and an Unreleased changelog entry follow.
# Package names, the packages/opengantry-cage/ directory, the internal bundle file name and temp-dir
# prefixes stay unchanged. Holds for both outcomes of the open fold-back question.
#
# Contract note: src/cli/lib/ is outside the roots but NOT a forbidden zone, because cage-bin.ts, the slim
# entry and cage.test.ts import from it and forbidden zones also ban imports (ADR-0045, MSN-0257 lesson).
#
# DoD 1 (bins): root package.json bin maps gantry-cage and opengantry-cage to dist/cli/cage-bin.js;
#        packages/opengantry-cage/package.json bin is exactly {"gantry-cage": "dist/cli/index.js"};
#        package-lock.json bin entries match, reproduced by `npm install --package-lock-only`.
# DoD 2 (program name): src/cli/cage-bin.ts and packages/opengantry-cage/src/entry.ts register as
#        gantry-cage, so usage and help say gantry-cage, also when invoked as opengantry-cage; comments in
#        cage-bin.ts, program-cage.ts, entry.ts and build.mjs updated.
# DoD 3 (tests): cage.test.ts asserts both root bin keys and runs the cage through gantry-cage and through
#        the alias; cage-suggest.test.ts wording follows; the slim package's tests expect
#        {"gantry-cage": …}, call gantry-cage via npx -p <tarball>, and check that `npx <tarball>` resolves
#        the single bin.
# DoD 4 (docs): README, docs/ADOPTION.md, docs/FEATURES.md and packages/opengantry-cage/README.md teach
#        gantry-cage; docs/CHANGELOG.md gains an Unreleased row and upgrade note (full package: opengantry-cage
#        still works as an alias; slim package: bin renamed); historical changelog rows unchanged.
# DoD 5 (gate): `./scripts/dev-validate-core.sh` passes (dev-validate-core OK); `npm run test:cage` passes.
#
# Not in this mission: extending scripts/assert-no-stale-cli-naming.sh to flag opengantry-cage (belongs to
# the later mission that removes the alias); examples/iii-integration/package-lock.json (snapshot); the
# release that publishes the rename (needs CI publishing fixed: EOTP with the current token).
