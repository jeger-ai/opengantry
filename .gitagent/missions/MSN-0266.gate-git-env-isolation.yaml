# OpenGantry mission scaffold (Planner: fill gate, TMVC narrowing, trace rows).
# Legislated by Planner stamp [MSN-0266]. Executor must not run until the [MSN-0266] legislation commit + pin.
#
# Legislated intent: gate commands and test processes must not inherit the GIT_ variables that locate a repository.
# Incident 2026-10-15: git sets GIT_DIR for hooks run in a linked worktree (a plain checkout gets none). The pre-push
# hook runs gantry verify, whose gate runner passes process.env to the gate; the gate ran npm test, and every test
# git call that did not strip GIT_DIR acted on the real repository: it set core.bare=true, a Fixture user.name and
# user.email, fixture gantry/gapman planner emails and commit.gpgsign=false in .git/config, committed 77 fixture
# commits onto the branch, force-pushed a fixture root commit over GitHub main and pushed an evil-branch. Reproduced
# in a throwaway repo: GIT_DIR appears in a worktree's pre-push hook env and not in a plain checkout's.
#
# Strip list (repository location only): GIT_DIR, GIT_WORK_TREE, GIT_INDEX_FILE, GIT_COMMON_DIR,
# GIT_OBJECT_DIRECTORY, GIT_ALTERNATE_OBJECT_DIRECTORIES, GIT_NAMESPACE. GIT_CONFIG_* (GIT_CONFIG_COUNT/KEY_n/VALUE_n,
# GIT_CONFIG_PARAMETERS) are kept: the cage session push guard injects core.hooksPath through them (ADR-0048
# decision 5). The gate keeps its cwd (the repository root), so git inside the gate finds the right repository.
# Hooks and templates are untouched: the fix is in the CLI, so adopters get it with the package.
#
# DoD 1 (shared list): src/cli/lib/git/git.ts exports the strip list and one function that returns an env without
#        those keys; gitChildEnv uses it, so it strips the whole list (today only GIT_DIR and GIT_WORK_TREE).
# DoD 2 (gate env): runGate (src/cli/lib/gate.ts) and spawnGateStreaming (src/cli/lib/gate-adapters/
#        spawn-stream-core.ts) spawn the gate with that env instead of process.env; cwd and shell unchanged.
# DoD 3 (test processes): src/cli/tests/test-tmpdir-setup.ts deletes the strip list from process.env at load, so
#        every npm test process and its children run without them; packages/opengantry-cage/tests/helpers.mjs does
#        the same for the slim package tests.
# DoD 4 (regression): new src/cli/tests/gate-git-env.test.ts: (a) runGate and spawnGateStreaming, with GIT_DIR in
#        the parent env pointing at a sentinel repo, run git in their own temp repo and leave the sentinel's config
#        and refs unchanged; (b) the incident replayed: a temp repo with a bare remote and a linked worktree whose
#        pre-push hook runs a gate through the built runGate that does git init and git config user.name Fixture in
#        a fresh temp dir; after git push from the worktree the main temp repo's config has no Fixture name and
#        core.bare stays false; (c) the preload leaves no strip-list key in a child test process started with
#        GIT_DIR set. Parts (a) and (b) fail against the unfixed build (shown in the trace).
# DoD 5 (docs): docs/CHANGELOG.md Unreleased entry (gate commands no longer inherit repository-locating GIT_
#        variables from hooks; matters for pushes from linked worktrees); docs/DEVELOPMENT.md notes the incident,
#        the strip list and that linked-worktree pushes are safe again once this lands.
# DoD 6 (gate): ./scripts/dev-validate-core.sh passes (dev-validate-core OK).
