# OpenGantry mission (Planner-stamped by [MSN-0261]). npm OIDC diagnostics on a failed CI publish.
#
# Legislated intent: When a CI publish fails, scripts/npm-publish-if-new.sh prints npm's own OIDC trusted-
# publishing messages (the oidc lines npm writes to its debug log, e.g. the token-exchange error body) so a
# missing or mismatched trusted publisher shows its reason in the job log; only oidc lines are printed, the
# workflow is unchanged.
#
# Why: v3.8.3 published @jeger-ai/opengantry through trusted publishing, but @jeger-ai/opengantry-cage failed
# twice with ENEEDAUTH and the job log never said why. npm 11 logs every OIDC outcome under the `oidc` prefix
# at silly/verbose level (lib/utils/oidc.js: no id-token permission, failed id_token fetch, "Failed token
# exchange request with body message: …", success). Those levels are not printed to the terminal but are
# always written to the per-run debug log whose path npm prints on failure ("A complete log of this run can
# be found in: …").
#
# DoD 1 (diagnostics): when `npm publish` fails with GITHUB_ACTIONS=true (not --dry-run), the script reads the
#        debug-log path from npm's own output and prints every line of that log containing ` oidc ` (and
#        nothing else from the log), after the existing ::error:: hint and before exiting with npm's exit
#        code; when the log or the oidc lines are missing it says so in one line. Successful publishes and
#        runs outside GitHub Actions are unchanged.
# DoD 2 (tests): src/cli/tests/npm-publish-if-new.test.ts covers, with a stub npm that writes a fixture debug
#        log: the exchange-failure line is printed, unrelated log lines (argv, config, tokens) are not, a
#        missing log path is reported, no diagnostics outside GitHub Actions or on success; existing cases
#        still pass.
# DoD 3 (docs): docs/DEVELOPMENT.md Releasing tells the reader where the reason appears and what the
#        common messages mean (no trusted publisher / field mismatch vs. missing id-token permission).
# DoD 4 (gate): `./scripts/dev-validate-core.sh` passes (dev-validate-core OK).
#
# Limit: no CI run can exercise this before the next failing publish (both packages' 3.8.3 are on npm, so a
# dispatch skips them). The proof here is the stub test plus npm's own source and debug-log format.
msn_id: MSN-0261
skill_key: substrate
gate_command: ./scripts/dev-validate-core.sh
trace_rows:
  - dod_id: "1"
    trace_quote: "DoD 1 MSN-0261 at 83d8118: scripts/npm-publish-if-new.sh tees npm publish output to a temp file (still streamed) and, when the publish fails with GITHUB_ACTIONS=true and not --dry-run, prints after the ::error:: hint only the lines of npm's debug log (path from npm's 'A complete log of this run can be found in:' line) matching ^N (silly|verbose|http|info|notice|warn|error) oidc, indented under npm's trusted-publishing (oidc) log for <name>, then exits with npm's code; it says when the log has no oidc lines or cannot be found; against real npm 11 with GITHUB_ACTIONS=true and a throwaway local registry it printed exactly '29 silly oidc Skipped because incorrect permissions for id-token within GitHub workflow' and no other debug-log line; the registry received no upload"
    anchor: "1277"
