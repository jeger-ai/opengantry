    anchor: "1278"
    status: PASS
  - dod_id: "3"
    trace_quote: "DoD 3 MSN-0261 at 83d8118: docs/DEVELOPMENT.md Releasing gains 'Why a publish was refused (MSN-0261)': where npm's oidc lines appear and what Failed token exchange request with body message, Skipped because incorrect permissions for id-token, Successfully retrieved and set token and no oidc lines mean; assert-docs-deterministic OK"
