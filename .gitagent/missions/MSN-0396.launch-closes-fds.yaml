# OpenGantry mission scaffold (Planner: fill gate, TMVC narrowing, trace rows).
# Legislated by Planner stamp [MSN-0396]. Executor must not run until the [MSN-0396] legislation commit + pin.
#
# Legislated intent: issue #356, the follow-up PR #379 (MSN-0395) left open. The review round showed on jai01 (Ubuntu
# 26.04.1, kernel 7.0.0-43) that an fd inherited above 15, past a gap of closed fds, reaches srt's sandbox and is
# writable, because Node's uv_disable_stdio_inheritance() marks fds close-on-exec only up to the first closed fd above
# 15; so workspace.write is not proven. (1) gantry admission launch closes every inherited fd above 2 before it starts
# the harness: it spawns the harness through an absolute /bin/bash (no PATH lookup, #369) that closes each fd listed in
# /proc/self/fd except 0-2 and then execs the harness, argv and stdio unchanged. The broker runs inside the launcher
# process, so there is no separate broker child. The bash helper moves from the cage probe to packages/core (missions
# may not import cage). (2) gantry admission probe --via-launch (and capabilities --probe --via-launch) starts the
# control and write-inherited-fd the way a real session would: a parent holding fd 20 past the gap 3-19, then gantry
# admission launch, then srt, then the sandboxed canary. workspace.write may be prevention only in that mode, with every
# canary of the family blocked; its evidence note says it requires the harness to be started via gantry admission
# launch. Without --via-launch the result stays not proven; the record's mechanism gains an optional launch field,
# absent by default, so default-mode digests are unchanged. (3) Re-run on this host: default, --strict-network,
# --via-launch and --via-launch --strict-network. artifact.read stays not proven until PR #376 merges. (4) Docs: the
# guide's Limits, ADR-0063 status and decision (d), coverage row U, the broker reference, the CHANGELOG; the release
# notes entry is folded into the existing #356 bullet (1500-word cap). A harness started any other way still leaks an
# fd past a gap, and the docs say so.
# No CI workflow change, no system configuration change, no registry change (commands.yaml has no flag field).
#
# Operator brief (2026-11-17, orchestrator brief for issue #356, MSN-0396; interrogation answers written by the agent
# from it).
# No trace rows: the evidence is .gitagent/runs/MSN-0396.json written by gantry verify --record (RULES §3).
