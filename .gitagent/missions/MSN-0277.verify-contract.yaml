# OpenGantry mission scaffold (Planner: fill gate, TMVC narrowing, trace rows).
# Legislated by Planner stamp [MSN-0277]. Executor must not run until the [MSN-0277] legislation commit + pin.
#
# Legislated intent: mission A of the standalone verify (roadmap #9, re-prioritized 2026-10-17 for another project
# of the operator's). A repository that has not adopted .gitagent/ declares what a change must satisfy in one
# contract file, and gantry verify --contract decides it deterministically: scope of the diff, a size budget, regex
# rules over added lines, and command checks with a failure baseline. Modelled on COMMITLY hangar's gate.js
# (commitly.gate.v1), whose gate.json is read natively. Mission B adds import/layer checks (JS/TS scanner, Python
# imports, regex fallback) and signed evidence; mission C the slim @jeger-ai/opengantry-verify package (bin +
# library) and SARIF/JUnit for contract results.
#
# Operator decisions (2026-10-17): verify.yaml canonical, gate.json accepted; a contract committed in the repository
# is read from the base commit, one outside it from disk; no built-in forbidden paths in verify (cage check covers
# CI configs and .env); results are digest-only (check output tails on stderr only); engine in
# src/cli/lib/verify-standalone/, docs in docs/guides/. gantry verify --mission is unchanged.
#
# DoD 1 (contract): verify.yaml with schema: opengantry.verify.v1 and keys base?, scope {allowed_paths?,
#        forbidden_paths?}, size {max_added_lines?, exclude?}, rules [{name, files, forbid, why?}], checks [{name,
#        run, expect: exit0|empty, heavy?, quick_run?, failures?}]. Strict: YAML 1.2 core, no aliases, unknown keys,
#        wrong types, empty names, duplicate check names and invalid regexes exit 2 with GXT_VERIFY_CONTRACT_INVALID.
#        gate.json with schema commitly.gate.v1 is read natively (base, allowed_paths, forbidden_paths,
#        max_added_lines, size_exclude, rules {name, approach, files, forbid}, checks {name, cmd, expect, heavy,
#        self_check, failures}); cage_protect and part are ignored with a stderr notice.
# DoD 2 (trust): a contract tracked in the repository is read from the base commit through git, never from the
#        working tree or HEAD, so a change cannot weaken its own contract; a contract outside the repository (or
#        untracked) is read from disk. The result records contract_source base|disk. The base is --base, else the
#        contract's base; neither, or a base that does not resolve, exits 2.
# DoD 3 (scope, size, rules): changed files are base...HEAD (committed), plus uncommitted and untracked files with
#        --worktree. Path patterns follow hangar: no wildcard = the path or a folder above it ("." = everything);
#        * one segment, ** any depth, ? one character. A changed file outside allowed_paths, or matching
#        forbidden_paths, fails. Added lines in files not matching size.exclude (deletions never count) over
#        max_added_lines fail. Each rule fails on every added line, in changed files matching its files globs, that
#        matches forbid, reported as file:line.
# DoD 4 (checks): each check runs with sh -c at the repository root. expect exit0 passes on exit 0; expect empty
#        passes when stdout is empty and the exit code is 0 or 1. With --quick a heavy check is skipped; with
#        --worktree a heavy check runs quick_run, or is skipped without one. A failing exit0 check with a failures
#        regex passes when every failure it names is already in the baseline; only new failures fail it.
# DoD 5 (modes): default judges the committed state and needs a clean tree; --worktree, --quick, --baseline (HEAD
#        at the base and a clean tree; writes which exit0 checks fail and their failures to --baseline-file, default
#        verify-baseline.json beside the contract) and --check-result <file> (exit 0 only when that result passed in
#        the default mode for this HEAD and this contract's sha256 on a clean tree). Exit 0 pass, 1 fail, 2 cannot
#        run (incl. --format sarif|junit with --contract, and --contract with --mission).
# DoD 6 (result): opengantry.verify-result.v1 with status, mode, head, base, contract {path, sha256, source}, paths
#        {changed, outside, forbidden}, size {added, max, files}, rules [{name, why, violations [{file, line}]}],
#        checks [{name, expect, exit, seconds, ok, reason, skipped?, failures?, new_failures?}], problems. --json
#        prints it on stdout, --out writes it. Digest-only: no check output and no added-line text in it; the human
#        summary on stderr shows the tail of a failing check's output.
# DoD 7 (tests): src/cli/tests/verify-standalone.test.ts and verify-standalone-cli.test.ts over temp git repos cover
#        DoD 1-6: schema errors, gate.json mapping, base-commit contract vs disk contract, scope/forbidden/size/rules,
#        exit0/empty/heavy/quick_run, baseline accepting known failures and failing new ones, --check-result
#        (pass, stale HEAD, changed contract, quick-mode result), exit codes, digest-only JSON, --mission unchanged.
# DoD 8 (ADR): .gitagent/out-of-scope/ADR-0051-standalone-verify-contract.md, status ACTIVE: context (verify without
#        .gitagent/, COMMITLY hangar as the model), decision (contract format and gate.json, trust from base, no
#        built-in paths, digest-only results, modes), consequences, follow-ups (missions B and C). ADR-0045, ADR-0047,
#        ADR-0027 and ADR-0049 stay unchanged.
# DoD 9 (docs): docs/guides/verify-contract.md (frontmatter, section guides) with a contract example, modes, exit
#        codes, CI snippet and limits; docs/index.md and README.md link it; docs/CHANGELOG.md Unreleased entry.
# DoD 10 (gate): ./scripts/dev-validate-core.sh passes (dev-validate-core OK).
