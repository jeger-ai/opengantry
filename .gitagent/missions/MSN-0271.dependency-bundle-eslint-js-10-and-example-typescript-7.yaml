#        yaml 2.9.1 and @modelcontextprotocol/sdk 1.32.1 from #212/#213 are still resolved; npm ci succeeds.
# DoD 2 (example bump): examples/iii-integration/package.json typescript is ^7.0.2 and its lockfile resolves
