# OpenGantry mission scaffold (Planner: fill gate, TMVC narrowing, trace rows).
# Legislated by Planner stamp [MSN-0271]. Executor must not run until the [MSN-0271] legislation commit + pin.
#
# Legislated intent: bundle two Dependabot bumps that change package.json and so need a mission (the
# trusted_automation policy covers only workflow pin bumps): @eslint/js ^9.28.0 -> ^10.0.1 at the root (PR #210;
# eslint 10.12 is already in use since MSN-0249) and typescript ^5.7.2 -> ^7.0.2 in examples/iii-integration
# (PR #211; the root is on TypeScript 7 since MSN-0248). Each bump is taken from its Dependabot commit with
# git cherry-pick -n (c2b68ffe9a for #210, ddb289855c for #211), so the three-way merge keeps the lockfile changes
# main gained from #212 and #213, and is committed under an [MSN-0271] subject. Dependabot closes #210 and #211 itself
# once main carries the versions.
#
# Re-legislated before execution (Planner option 1): @eslint/js 10 adds no-useless-assignment to the recommended
# rules, and npm run lint then fails on src/cli/lib/virtual-scratch-store.ts:150 (the dead initial `let mtime = 0`
# in scavengeVirtualFlights). #210's CI missed it because CI lints only changed files. The contract now also allows
# that one file; every other source change still means stop and re-legislate.
#
# DoD 1 (root bump): package.json devDependencies @eslint/js is ^10.0.1 and package-lock.json resolves 10.0.1;
#        yaml 2.9.1 and @modelcontextprotocol/sdk 1.32.1 from #212/#213 are still resolved; npm ci succeeds.
# DoD 2 (example bump): examples/iii-integration/package.json typescript is ^7.0.2 and its lockfile resolves
#        7.0.2; npm ci in the example succeeds.
# DoD 3 (one source fix): the only source change is `let mtime: number;` instead of `let mtime = 0;` in
#        src/cli/lib/virtual-scratch-store.ts (both branches still assign it; no behaviour change); git diff
#        origin/main touches only the contract paths and the mission file; npm run lint passes over src/cli/**/*.ts
#        with @eslint/js 10; the iii offline validator passes.
# DoD 4 (changelog): docs/CHANGELOG.md Unreleased row gains a dependencies note (yaml 2.9.1, MCP SDK 1.32.1,
#        @eslint/js 10.0.1, example typescript 7.0.2).
# DoD 5 (gate): the composite gate passes (dev-validate-core OK, lint, example install and offline validate).
