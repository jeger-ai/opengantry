# OpenGantry mission scaffold (Planner: fill gate, TMVC narrowing, trace rows).
# Legislated by Planner stamp [MSN-0288]. Executor must not run until the [MSN-0288] legislation commit + pin.
#
# Legislated intent: ADR-0052 migration step 5a (A8, hooks call the CLI). gantry hook pre-commit, pre-push and
# post-checkout carry the logic of the tracked .githooks scripts; the three hooks and their init templates become
# one-line shims that exec gantry hook <name>. hook pre-push reads the ref lines git passes on stdin: a ref deletion
# verifies nothing, a new branch compares with its upstream (then main, master, the parent commit), an update compares
# remote..local; per range it runs verify --pre-push on changed missions, the perimeter advisory when governance files
# change, gantry check when the manifest or skills change, and the specimen changed-code gate when src/cli changes.
#
# Operator direction (2026-10-18, "merge and continue until everything is done"): step 5a is hooks only; the CI and
# template scripts (validate-gxt.sh, verify-pr-missions.sh, gxt-manifest-lib.mjs, gxt-resolve/pin-mission.sh) move
# into the CLI in step 5b; cage-guard pre-push stays in the slim bundle until step 6. No trace rows: the evidence is
# .gitagent/runs/MSN-0288.json written by gantry verify --record (RULES §3).
#
# DoD 1 (lib): src/cli/lib/git/git-hooks.ts exports ZERO_SHA, parsePrePushRefLines, fallbackPushBase and
#        pushRangesFromRefLines (deletion lines contribute nothing; a zero remote sha falls back to upstream, main,
#        master, then the parent; an update is remote..local).
# DoD 2 (command): src/cli/commands/hook.ts runs pre-commit (pinned mission or a no-op; tmvc guard, strict from
#        gxt.tmvcGuardStrict or GXT_TMVC_GUARD_STRICT=1; advisory contract check over staged sources), pre-push (per
#        range: verify --pre-push on changed missions via runVerifyCore, perimeter advisory, gantry check, the
#        specimen changed-code gate when scripts/check-changed-code.sh exists) and post-checkout (EXECUTOR_LOG.md from
#        the template on a feature branch); src/cli/program-hook.ts registers gantry hook with the three subcommands;
#        program.ts wires it; pre-push accepts the remote name and URL git passes; stdin is read only when it is not
#        a TTY.
# DoD 3 (hooks): .githooks/pre-commit, pre-push, post-checkout and templates/.githooks/* are byte-identical shims that
#        cd to the repo root and exec node dist/cli/index.js hook <name> (or gantry on PATH); they stay executable.
# DoD 4 (law): .gitagent/registry/commands.yaml gains hook, hook post-checkout, hook pre-commit, hook pre-push (since
#        MSN-0288); gantry arch check (whole tree) passes after gantry arch check --ratchet --allow-raise.
# DoD 5 (tests): src/cli/tests/hook.test.ts covers the parser, the ranges, hook pre-push with a deletion and with a
#        range, hook pre-commit without a pin, hook post-checkout on a feature branch, on main and on a file checkout;
#        src/cli/tests/git-hooks.test.ts asserts the shim delegates to gantry hook pre-commit and propagates its exit
#        code; all unit tests pass; conformance passes with no golden changed.
# DoD 6 (docs): docs/DEVELOPMENT.md hooks section, docs/guides/troubleshooting.md, docs/CHANGELOG.md.
# DoD 7 (dogfood): this mission is verified by its committed run record; ./scripts/dev-validate-core.sh passes;
#        git diff --name-only origin/main...HEAD lists only paths under contract.tmvc_roots.
