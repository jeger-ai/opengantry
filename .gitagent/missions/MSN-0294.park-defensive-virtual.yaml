# OpenGantry mission scaffold (Planner: fill gate, TMVC narrowing, trace rows).
# Legislated by Planner stamp [MSN-0294]. Executor must not run until the [MSN-0294] legislation commit + pin.
#
# Legislated intent: ADR-0052 A10, park the zero-use experiments, part two. Defensive profiles (the defensive_profile
# config block with its presets and guards, the gantry init preset step and flags, the gantry verify defensive phase)
# move to examples/defensive-profiles/ and the virtual scratch store (the virtual_capture mission flag, the
# .gitagent/virtual/<flight-id>/ gate capture, purge and scavenging, the KPI stale-evidence exemption) moves to
# examples/virtual-scratch/, both with their tests, a README and a tsconfig; gantry verify has no defensive phase row,
# a defensive_profile block and a mission's virtual_capture field are ignored, ledger.mode is explicit (resolveLedgerMode
# in core, no preset fallback), the flight-telemetry doctor drops the preset warning, the init wizard and flags lose
# the preset, the template config.json loses the block, the mission schema marks virtual_capture ignored.
#
# Operator direction (2026-10-18, "merge and continue until everything is done"): A10 parks, it does not delete;
# the structural law of TARGET_ARCHITECTURE.yaml is the deterministic replacement for defensive guards. No trace rows:
# the evidence is .gitagent/runs/MSN-0294.json written by gantry verify --record (RULES §3).
#
# DoD 1 (examples): examples/defensive-profiles/{src/defensive-guard.ts, defensive-profile.ts,
#        defensive-profile-presets.ts, verify-defensive-phase.ts (with its own DefensiveFailure type),
#        init-defensive-profile.ts, tests/defensive-guard.test.ts, tests/defensive-profile.test.ts, README.md,
#        tsconfig.json} and examples/virtual-scratch/{src/virtual-scratch-store.ts, tests/virtual-scratch.test.ts,
#        README.md, tsconfig.json} exist, moved with git mv; both type-check (npx tsc -p <example>/tsconfig.json).
# DoD 2 (verify): no defensive phase: verify-engine, verify-phase-steps, verify-failure, verify-failure-normalize,
#        verify-hints, verify-payload (no defensive_warnings or defensive_audits), command-reporter and
#        VERIFY_PHASE_IDS no longer mention it; no virtual capture: verify-engine drops the flight hooks and
#        kpi-engine the .gitagent/virtual/ exemption; the two tests that named the phase use kpi instead.
# DoD 3 (config, init): packages/core/src/config.ts exports resolveLedgerMode (explicit or off); gxt-config.ts is a
#        thin loader over the core shape and ignores defensive_profile; flight-telemetry-doctor.ts has no preset
#        warning; gantry init has no --defensive-profile or --no-defensive-profile, no wizard step and no config
#        merge; templates/.gitagent/config.json has no defensive_profile block; the mission schema (template and
#        mirror) marks virtual_capture ignored.
# DoD 4 (behaviour): all unit tests pass; conformance passes with init.bare-git, init.dry-run.bare-git and
#        verify.junit.mission-pass re-recorded (the init flag and the phase row) and no other golden changed;
#        gantry arch check passes after gantry arch check --ratchet --allow-raise.
# DoD 5 (docs, dogfood): docs/reference/experimental.md, docs/concepts/perimeters.md, docs/FEATURES.md,
#        docs/ADR-EPHEMERAL-VIRTUALIZATION.md, docs/CHANGELOG.md; this mission is verified by its committed run record;
#        ./scripts/dev-validate-core.sh passes; git diff --name-only origin/main...HEAD lists only paths under
#        contract.tmvc_roots.
