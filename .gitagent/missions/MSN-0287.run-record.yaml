# OpenGantry mission scaffold (Planner: fill gate, TMVC narrowing, trace rows).
# Legislated by Planner stamp [MSN-0287]. Executor must not run until the [MSN-0287] legislation commit + pin.
#
# Legislated intent: ADR-0052 migration step 4 (A4 one RunRecord, A5 machine-written evidence; both approved by the
# operator on 2026-10-17). gantry verify --record runs every phase on a clean, committed tree and then writes
# .gitagent/runs/<MSN>.json (schema opengantry.run-record.v1: head, tree, law digest, the gate check with its exit and
# output digest, status PASS). A mission without trace_rows is verified by that record: missing, mismatch (MSN, mission
# path, law digest, head not an ancestor of HEAD) or stale (a path under the effective roots changed since the record's
# head). Missions with trace rows keep the legacy quote mapping. The Planner stamp becomes the newest Planner-email
# [MSN] commit that modifies the mission file (RULES §6.1), shared by git-proof, the contract seal and the
# interrogation digest. Three GXT_RUN_RECORD_* codes are registered. This mission carries no trace rows: it is the
# first verified by its own run record.
#
# Operator direction (2026-10-18, "merge and continue until everything is done"): EXECUTOR_LOG.md stays as optional
# narrative; the record, not a quote, is the evidence; the baseline is raised with --ratchet --allow-raise because
# core and lib grow here.
#
# DoD 1 (core): packages/core/src/run-record.ts exports RUN_RECORD_SCHEMA, RunRecord, RunRecordCheck, sha256Hex,
#        runRecordDigest, evaluateRunRecord (missing, mismatch, stale, in that order; pure, git facts supplied by the
#        loader); packages/core/tests/run-record.test.ts; REL_RUNS_DIR in core constants; core index exports it.
# DoD 2 (verify): src/cli/lib/verify/verify-run-record.ts loads the record, computes the law digest (effective roots,
#        forbidden zones, gate, contract digest), checks ancestry and the diff since the record head over the effective
#        roots (the record itself excepted), and writes the record for --record after asserting a clean tree;
#        verify-engine runs it in place of the trace phase when the mission has no trace rows; a rowless mission with a
#        record is no longer a legislative stub for --pre-push or the interrogation digest; RunRecordFailure maps to
#        GXT_RUN_RECORD_MISSING / STALE / MISMATCH with hints and the trace failed_gate; --record on
#        gantry verify (program-workflow, VerifyOptions) and a stderr note naming the written file.
# DoD 3 (stamp): git-proof.ts findPlannerStamp: the stamp is the newest Planner-email [MSN] commit that modifies the
#        mission file; a later Planner-email [MSN] commit that leaves it alone no longer fails verify;
#        resolvePlannerStampHash (contract seal, interrogation digest, path drift) uses the same rule;
#        src/cli/tests/git-proof.test.ts covers both cases.
# DoD 4 (law): .gitagent/planner/RULES.md and templates/.gitagent/planner/RULES.md §3 name the run record as the
#        primary evidence and trace rows as legacy, §6.1 defines the stamp as above; .gitagent/registry/error-codes.yaml
#        gains the three codes (since MSN-0287); ARCH_BASELINE.json raised by gantry arch check --ratchet --allow-raise.
# DoD 5 (behaviour): conformance fixtures mission-norows, mission-record, mission-record-stale with goldens for
#        verify (missing, pass, stale), --pre-push on both and --record (tree shows the record); no existing golden
#        changed; all unit tests pass.
# DoD 6 (docs): docs/concepts/trace-evidence.md (Run records section with the three codes), docs/concepts/verify.md
#        (Evidence phase, --record), docs/DEVELOPMENT.md (mission graph step 6, Cursor session, evidence row),
#        docs/MANIFESTO.md (the executor-never-verifies-itself line), docs/CHANGELOG.md substrate note.
# DoD 7 (dogfood): this mission has trace_rows: [] and is verified by .gitagent/runs/MSN-0287.json written with
#        gantry verify --record on the clean committed tree and committed; ./scripts/dev-validate-core.sh passes;
#        git diff --name-only origin/main...HEAD lists only paths under contract.tmvc_roots.
msn_id: MSN-0287
skill_key: substrate
gate_command: ./scripts/dev-validate-core.sh
trace_rows: []
