# OpenGantry mission scaffold (Planner: fill gate, TMVC narrowing, trace rows).
# Legislated by Planner stamp [MSN-0386]. Executor must not run until the [MSN-0386] legislation commit + pin.
#
# Legislated intent: issue #356 slice 3: the admission broker state machine and its local process. A stateful broker
# in packages/missions/src/admission wraps the pure core admission functions: it holds the PermitLedger, its authority
# (brokerId, epoch), the resolved policy and capability report, decides against the host cell it resolved itself, runs
# the lifecycle received, authorized or denied, dispatch-intent, confirmed, failed or unknown, journals and fsyncs
# dispatch-intent before any effect and refuses dispatch when the journal write fails, recovers an open intent as
# unknown on restart without replay, and bumps its epoch on a policy or authority change so older permits refuse. An
# append-only journal file under the git dir with one exclusive lock and no stale takeover, a size cap that refuses
# new dispatches, and its anchor bound into the run record through an additive field so gantry verify detects
# truncation or rewriting. A hidden gantry admission serve on a Unix domain socket outside the state dir and git dir,
# strict 64 KiB requests, permits never leave the broker, Linux only. Two minimal dispatchers: workspace.write through
# a held parent directory handle with O_NOFOLLOW and identity checks, and process.spawn with argv arrays, no shell, an
# exact argsDigest and an env allowlist; every other family is unsupported. gantry cage policy also denies the journal
# dir. No OS confinement adapter, no host broker, no prevention cell. Tests first; the cage policy pinned test and its
# conformance golden are updated for the added deny entries; the missions and command layer budgets are raised with
# arch check --ratchet --allow-raise.
#
# Operator brief (2026-11-16, orchestrator brief for issue #356 slice 3; interrogation answers written by the agent from it).
# Re-legislated 2026-11-17 (PR #370 review round): packages/missions/src/mission-verify/engine.ts added to the roots so a passing
# verify shows an admission journal anchor not verified here (owner decision (a)).
# Re-legislated 2026-11-17 (PR #370 review round 2): test/conformance/golden/verify.mission-record.json and
# verify.pre-push.mission-record.json added, re-recorded for the "not verified here" label on a record without an anchor.
# No trace rows: the evidence is .gitagent/runs/MSN-0386.json written by gantry verify --record (RULES §3).
