# OpenGantry mission scaffold (Planner: fill gate, TMVC narrowing, trace rows).
# Legislated by Planner stamp [MSN-0282]. Executor must not run until the [MSN-0282] legislation commit + pin.
#
# Legislated intent: ADR-0052 migration step 2a. Two workspace packages, core (pure domain) and git (the git
# adapter), built by tsc project references into dist/packages/ and reached through the root package.json imports
# field (#core/*, #git/*), so the checkout and the published tarball resolve them the same way and nothing is
# published separately. src/cli keeps re-export facades for the moved modules, so no importer and no test changes;
# step 2b ports the cage onto the packages, step 3 removes the facades. CLI output unchanged (conformance suite).
#
# Operator direction (2026-10-18, "merge and continue until everything is done"): step 2 is split into 2a and 2b so
# each PR stays reviewable; packages are real (own package.json, tsconfig, tests) but private, per ADR-0052 A1's
# publishing note.
#
# DoD 1 (core): packages/core with package.json (private, no dependencies), tsconfig.json (composite, outDir
#        dist/packages/core) and src/{canonical-json,constants,error-codes,manifest,path-glob,user-error,index}.ts
#        moved or extracted from src/cli/lib (git mv keeps history); no node: import anywhere under packages/core/src;
#        tests/core.test.ts covers canonical JSON, GantryUserError code mapping, manifest shape, arch globs, constants.
# DoD 2 (git): packages/git with src/{git,git-staged,index}.ts moved from src/cli/lib/git, importing #core only;
#        tests/git.test.ts covers getRepoRoot, gitRunOk and withoutGitRepoEnv on a temp repository.
# DoD 3 (build): tsconfig.base.json shared options; root tsconfig.json composite with references to the packages;
#        npm run build runs tsc -b; dist/packages/{core,git}/src/*.js and .d.ts emitted; root package.json imports
#        maps #core/* and #git/* to dist/packages; scripts/prune-dist.mjs maps dist/packages/<name>/ back to
#        packages/<name>/; eslint.config.js lints packages/*/src; npm run test:packages runs dist/packages/*/tests and
#        npm test includes it; the slim cage (npm run build:cage, npm run test:cage) builds and passes unchanged.
# DoD 4 (facades): src/cli/lib/{canonical-json,path-glob,gxt-error-codes,git/git,git/git-staged}.ts are re-export
#        facades; errors.ts, constants.ts, manifest.ts and types.ts import the moved parts from #core; GantryUserError
#        is one class (dist/cli/lib/errors.js and dist/packages/core/src/user-error.js export the same constructor);
#        no other src/cli module changes; the only test change is prune-dist.test.ts accepting the tsc -b step.
# DoD 5 (law): TARGET_ARCHITECTURE.yaml scan_roots add packages/core/** and packages/git/**, layers core and git,
#        rules RULE-CORE-NO-NODE-IO, RULE-CORE-NO-GIT-LAYER, RULE-CORE-NO-LIB-LAYER, RULE-CORE-NO-COMMAND-LAYER,
#        RULE-GIT-NO-LIB-LAYER, RULE-GIT-NO-COMMAND-LAYER; gantry arch check over src/cli and both packages OK;
#        scripts/arch-baseline.mjs walks scan_roots; ARCH_BASELINE.json regenerated with core and git rows and a
#        smaller lib row, --check OK, byte-identical when regenerated at its recorded commit.
# DoD 6 (behaviour): conformance suite 82 pass, 0 fail, 3 skipped with no golden file changed; all unit tests pass.
# DoD 7 (docs): docs/ARCHITECTURE.md layers table and import rules, docs/DEVELOPMENT.md Packages section,
#        docs/CHANGELOG.md substrate note and Unreleased bullet.
# DoD 8 (gate): ./scripts/dev-validate-core.sh passes (dev-validate-core OK); git diff --name-only origin/main...HEAD
#        lists only paths under contract.tmvc_roots.
