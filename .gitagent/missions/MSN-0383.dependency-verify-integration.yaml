# OpenGantry mission scaffold (Planner: fill gate, TMVC narrowing, trace rows).
# Legislated by Planner stamp [MSN-0383]. Executor must not run until the [MSN-0383] legislation commit + pin.
#
# Legislated intent: issue #355 slice 3: gantry verify --contract evaluates dependency admission when the effective
# contract has a dependencies section. Policy only from the base verify.yaml (a task contract cannot supply one
# without a base floor); approvals, allowed signers, base graph, baseline and file: content digests are read from the
# base commit with git object reads. Changed npm manifest and lock files are detected; unsupported lockfiles and a
# manifest change without its lock hold. Additive opengantry.verify-result.v2 with a dependencies section (outcome,
# reason codes, mode, enforcement audit, base/head, policy revision, graph and diff digests, approvals used,
# ecosystems) inside the signed payload; enforce fails closed, audit labels; old v1 readers refuse it;
# dependency_update bumps get no exemption; zod schema in core, conformance golden, docs; verify and core budgets
# raised with arch check --ratchet --allow-raise.
#
# Operator brief (2026-11-16, orchestrator brief for issue #355; interrogation answers written by the agent from it).
# No trace rows: the evidence is .gitagent/runs/MSN-0383.json written by gantry verify --record (RULES §3).
