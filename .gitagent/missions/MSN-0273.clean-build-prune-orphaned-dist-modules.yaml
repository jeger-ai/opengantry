# OpenGantry mission scaffold (Planner: fill gate, TMVC narrowing, trace rows).
# Legislated by Planner stamp [MSN-0273]. Executor must not run until the [MSN-0273] legislation commit + pin.
#
# Legislated intent: npm run build never removes compiled files whose TypeScript source is gone. The shared main
# checkout's dist held 84 such modules (for example an old dist/cli/lib/git.js from before the git helper moved) and
# three stale test files whose 10 tests ran in every npm test there and inflated gate counts (MSN-0263 traced 902;
# the real count was 892). The package publishes dist/ except dist/cli/tests, and prepublishOnly runs the build, so a
# hand publish from such a working copy would ship them; CI publishes from a fresh checkout and is not affected.
#
# Design: prune after tsc instead of wiping dist first. Several sessions share checkouts (2026-10-15); an rm -rf dist
# before tsc leaves a window with no CLI and no compiled tests for any hook, test run or MCP server using that dist.
# Pruning touches only files with no source, so dist is never empty. No change to CLI source or to anything shipped
# to adopters (templates/ forbidden; prune-dist.mjs is registered as a repo-only script).
#
# DoD 1 (prune): new scripts/prune-dist.mjs [--root <dir>] removes every file under <root>/dist (.js, .js.map,
#        .d.ts, .d.ts.map) whose source <root>/src/<same path>.ts does not exist, then removes directories it
#        emptied; it never touches a file that has a source, and prints how many files it removed; listed in
#        REPO_ONLY_SCRIPTS (scripts/lib/asset-catalog-static.mjs).
# DoD 2 (build): package.json build runs node scripts/prune-dist.mjs right after tsc and before build:cage; dist is
#        never removed as a whole.
# DoD 3 (slim): packages/opengantry-cage/build.mjs leaves only dist/cli/index.js and
#        dist/cli/lib/cage/opengantry-cage.js in packages/opengantry-cage/dist, removing anything else after bundling.
# DoD 4 (pack guard): scripts/npm-pack-check.sh fails when the tarball holds a package/dist/**/*.js or *.d.ts with no
#        src/**/*.ts source; shown failing with an orphan injected after the build and passing on a clean build.
# DoD 5 (test): new src/cli/tests/prune-dist.test.ts runs the script on temp fixture trees (orphans with maps and
#        declarations, nested empty dirs, kept files with sources) and asserts the built dist of the repo has no orphan.
# DoD 6 (docs): docs/DEVELOPMENT.md notes that the build prunes orphaned dist files and why it does not wipe dist.
# DoD 7 (gate): ./scripts/dev-validate-core.sh && ./scripts/npm-pack-check.sh passes.
