# OpenGantry mission (Planner-stamped by [MSN-0257]). Release workflow only; no CLI or package change.
#
# Legislated intent: Make npm-publish.yml idempotent: skip any package whose version is already on npm, and
# add a guarded workflow_dispatch so a maintainer can finish a partial release (v3.8.2 published
# @jeger-ai/opengantry but not @jeger-ai/opengantry-cage) from main with provenance, refusing unless the
# published inputs on main equal the release tag.
#
# Why a dispatch: re-running the failed v3.8.2 run uses the workflow file at the tagged commit, so a fix on
# main can only reach it through a new run from main. Tags are never moved.
#
# DoD 1 (publish script): scripts/npm-publish-if-new.sh [--workspace <name>] [--dry-run] reads name and
#        version from the root or workspace package.json, runs `npm view <name>@<version> version`, prints
#        "already published, skipping" and exits 0 when it matches, runs `npm publish [--workspace <name>]
#        --provenance --access public` (or `npm publish --dry-run` with --dry-run) on E404, and fails closed
#        (exit 1, nothing published) on any other npm view error.
# DoD 2 (workflow): npm-publish.yml keeps `push: tags: v*`, adds `workflow_dispatch` with a required `tag`
#        input, and both publish steps call the script; no bare `npm publish` step remains. On dispatch a
#        guard step runs before Validate stack and fails unless the tag matches v<package.json version>,
#        the tag exists, and `git diff --quiet <tag> HEAD` is empty for the published inputs (src/ except
#        src/cli/tests/, packages/, package.json, package-lock.json, templates/, README.md, LICENSE, NOTICE).
# DoD 3 (tests): src/cli/tests/npm-publish-if-new.test.ts, offline with a stub npm on PATH: skip on an
#        existing version (npm publish never called), publish with --provenance --access public on E404,
#        workspace mode reads the workspace package.json and passes --workspace, a non-404 view error exits 1
#        without publishing; and a structural check of npm-publish.yml (triggers, tag input, guard paths,
#        both publish steps on the script).
# DoD 4 (docs): docs/DEVELOPMENT.md gains a short Releasing section: tag v<version> on the release merge
#        commit, NPM_TOKEN must cover every package in the @jeger-ai scope (a new package name needs this),
#        and how to finish a partial release with `gh workflow run npm-publish.yml -f tag=v<version>`.
# DoD 5 (gate): `./scripts/dev-validate-core.sh` passes (dev-validate-core OK).
#
# After merge (Planner, not this mission): widen NPM_TOKEN to the @jeger-ai scope, then run
# `gh workflow run npm-publish.yml -f tag=v3.8.2` from main; @jeger-ai/opengantry@3.8.2 is skipped and
# @jeger-ai/opengantry-cage@3.8.2 is published. Its provenance names the main commit the run used.
