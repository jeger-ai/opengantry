    hypothesis: Operator authorizes work within declared TMVC and documents boundary
      decision on the record.
    operator_answer: Confirmed. src/cli/tests/npm-publish-if-new.test.ts is a new
      test outside the import layers by design, like the existing
      verify-pr-missions and trusted-automation script tests; it runs
      scripts/npm-publish-if-new.sh against a stub npm on PATH (no network) and
      parses .github/workflows/npm-publish.yml with the yaml package. No layer
      rule changes.
  - finding_id: 4367eadf9a61
    kind: adr_conflict
    question: Intent may relate to ADR-0048. Accept ADR decision, reject
      applicability, or cite superseding rationale?
    hypothesis: Operator explicitly accepts or rejects ADR ADR-0048 before
      legislation proceeds.
    operator_answer: Reject applicability; ADR-0048 stays ACTIVE and unchanged. The
      match is the word cage in the package name @jeger-ai/opengantry-cage; this
      mission changes only how the release workflow publishes packages (skip a
      version already on npm, a guarded manual re-run), not cage rules,
      overrides or runtime behaviour.
    adr_refs:
      - ADR-0048
