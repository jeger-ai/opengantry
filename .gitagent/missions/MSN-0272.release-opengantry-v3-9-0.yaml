# OpenGantry mission (Planner-stamped by [MSN-0272]). Release v3.9.0. No code.
#
# Legislated intent: Release OpenGantry v3.9.0, a minor release for two new cage commands: gantry cage check
# (MSN-0267) and gantry cage watch (MSN-0268, ADR-0050 as amended), plus the restructured docs with release notes
# (MSN-0270), gate git isolation in linked worktrees (MSN-0266), the session cage on macOS (MSN-0265) and the
# shipped CI iii example install (MSN-0263) and the dependency bundle (MSN-0271: @eslint/js 10, TypeScript 7 in the
# iii example, yaml and MCP SDK lockfile bumps). Version parity 3.9.0 including the slim package; the Unreleased entries
# in docs/reference/release-notes.md and the Unreleased upgrade notes in docs/CHANGELOG.md become v3.9.0. No code.
# First release after MSN-0270 moved release highlights out of CHANGELOG.md, so there is no highlights row and no
# README version line to update.
#
# Precondition: PR #220 (MSN-0270) is merged (362df2c); this mission branches from main after it.
#
# DoD 1 (version parity): 3.9.0 in package.json, package-lock.json (root, packages[""] and
#        packages["packages/opengantry-cage"]), packages/opengantry-cage/package.json, both
#        SUBSTRATE.version.json files and templates/integrations/compatibility.json; no 3.8.3 left in those files;
#        npm install --package-lock-only reproduces the lockfile; `gantry --version`, `gantry-cage --version` (full
#        and slim bins) print 3.9.0; `gantry doctor` reports the substrate version matching.
#        examples/iii-integration/package-lock.json stays out of scope (snapshot, as in MSN-0246 / MSN-0256 / MSN-0260).
# DoD 2 (release notes): in docs/reference/release-notes.md the "Unreleased" heading becomes a "3.9" section with a
#        **3.9.0** entry carrying the current Unreleased items (cage check, cage watch, session push guard, docs
#        reorganized, cage on macOS, shipped CI iii install, dependencies, gates in linked worktrees); no "Unreleased" left on the
#        page; the page stays within docs/STYLE.md (no mission ids, at most 1,500 words).
# DoD 3 (CHANGELOG): the "### Unreleased (…)" upgrade notes become "### From v3.8.3 (cage check, cage watch, docs
#        layout — v3.9.0)" with install lines for both packages (`npm install @jeger-ai/opengantry@3.9.0`,
#        `npm install @jeger-ai/opengantry-cage@3.9.0`); the substrate note names CLI 3.9.0; no "Unreleased" left.
# DoD 4 (scope + packaging): the diff against main touches only the contract files and the mission file; no src/
#        change; `npm run pack:check` OK; `npm run test:cage` passes for the 3.9.0 tarball.
# DoD 5 (gate): `./scripts/dev-validate-core.sh` passes (dev-validate-core OK).
#
# Before tagging (Planner, not this mission): the slim package README links https://opengantry.ai/docs/cage/ pages
# that exist only once the site mission (MSN-0273, opengantry.ai) is live, and the tag publishes both packages to
# npm. Order: merge this release; MSN-0273 pins OPENGANTRY_DOCS_REF to the release merge commit (the fetch script
# reads any ref's tarball) and deploys; then tag v3.9.0 on the release merge commit (npm-publish.yml publishes both
# packages with provenance); then re-pin the site to the v3.9.0 tag.
