# OpenGantry mission scaffold (Planner: fill gate, TMVC narrowing, trace rows).
# Legislated by Planner stamp [MSN-0252]. Part (A) of MSN-0252/0253/0254 cage audit split. Executor must not run until
# [MSN-0252] legislation commit + pin. See MSN-0253 (journal/signals) and MSN-0254 (size-cap + ADR).
#
# Legislated intent: Publish `@jeger-ai/opengantry-cage` as a slim npm package (workspace under
# `packages/opengantry-cage/`) so `npx @jeger-ai/opengantry-cage -- <cmd>` resolves without pulling the full
# OpenGantry stack (no native modules, no install scripts, runtime deps limited to commander + Node built-ins).
#
# DoD 1 (package shape): `packages/opengantry-cage/package.json` publishes bin `opengantry-cage`; `dependencies`
#        contain only `commander` (no better-sqlite3, sqlite-vec, @modelcontextprotocol/sdk, ajv, yaml, zod, etc.);
#        no `install`/`postinstall` scripts; `engines.node` documents >=24. Test: `npm pack` in package dir + `npm ls`
#        in a clean install of the packed tarball.
# DoD 2 (unpacked size budget): the unpacked contents of `packages/opengantry-cage/` (build output included) total at
#        most 2,097,152 bytes (2 MiB). Test: script or unit test asserts byte sum under cap.
# DoD 3 (npx latency): with a warm npm cache, `npx` against a locally packed `@jeger-ai/opengantry-cage` tarball runs
#        `opengantry-cage --version` and exits 0 in under 1.5 seconds wall time (test documents warm-cache precondition).
# DoD 4 (behaviour parity smoke): same tarball, `npx … opengantry-cage -- node -e "tamper .env"` in a scratch repo
#        exits 3 and restores `.env` (cage logic shared or bundled without widening deps).
# DoD 5 (release + adoption docs): `.github/workflows/npm-publish.yml` publishes the slim package; README.md,
#        docs/ADOPTION.md and docs/FEATURES.md document `npx @jeger-ai/opengantry-cage` (not only `-p @jeger-ai/opengantry`).
#        Root `package.json` / `package-lock.json` wire the workspace.
# DoD 6 (gate): `./scripts/dev-validate-core.sh` passes (dev-validate-core OK).
