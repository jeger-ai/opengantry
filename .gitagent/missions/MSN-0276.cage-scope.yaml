# OpenGantry mission scaffold (Planner: fill gate, TMVC narrowing, trace rows).
# Legislated by Planner stamp [MSN-0276]. Executor must not run until the [MSN-0276] legislation commit + pin.
#
# Legislated intent: a scope mode for gantry cage. The cage protects a blocklist today (built-in rules, protect:).
# A build task usually knows the opposite: the few directories an implementer may touch. A scope turns the cage into
# a per-task sandbox without the mission substrate: everything git would track outside the allowed globs is
# protected, in the session, watch and check.
#
# Constraints: no scope = today's behaviour, byte for byte. A scope only adds protection (ADR-0048 decisions 1-2).
# Separate from mission contracts (ADR-0045): no Planner seal, no import rules, no trace, verify ignores it; reading
# a mission contract as a cage scope is a later mission. No MCP tool, no workflow, no adopter template
# (.github/workflows/ and templates/ forbidden); packages/opengantry-cage/src/ forbidden (the slim bin gets
# --allow-only through the shared src/cli/program-cage.ts). Branch cut from msn-0275-cage-dependency-freeze (PR #227);
# the PR opens against main after #227 merges.
#
# DoD 1 (config): .cage.yaml takes a top-level allow_only: list of globs (same syntax as protect: globs). An empty
#        list, a non-string entry, or an absolute or .. glob exits 2 with GXT_CAGE_CONFIG_INVALID. The resolved scope
#        is part of the cage plan, of the serialized plan the session push guard reads, and of the journal.
# DoD 2 (flag): --allow-only <glob> (repeatable) on the session (gantry cage -- <cmd>, gantry-cage), cage watch and
#        cage check, also before the subcommand. With both .cage.yaml allow_only and the flag, a path is in scope only
#        when it matches both (intersection), so neither widens the other.
# DoD 3 (rule): every path outside the scope that git would track (tracked files, and untracked files that are not
#        gitignored) gets a new built-in out_of_scope rule, revert. Gitignored files outside the scope are not
#        policed; .git stays under git_control; other built-in rules still apply inside and outside the scope and
#        keep their own rule id. Session: modified restored, added removed, deleted restored; watch prompts; check
#        exits 3; push guard blocks. Without a scope, nothing changes. --allow-override <path> can relax an
#        out-of-scope path for one session run, announced (decision 3).
# DoD 4 (baseline): the out-of-scope baseline is a git tree written through a temporary index (the real index, HEAD
#        and refs untouched); restores bring back bytes, the executable bit and symlinks from that tree; no in-memory
#        cap applies to it. The journal records the tree so kill -9 recovery restores out-of-scope changes. A scope
#        run outside a git work tree exits 2 with GXT_CAGE_SCOPE_NOT_GIT before the command runs.
# DoD 5 (reports): rows name rule out_of_scope (source builtin). The session report, gantry.cage-check.v1 and
#        gantry.cage-watch.v1 gain an additive scope: string[] | null field; start lines name the scope.
#        Digest-only, no file bodies.
# DoD 6 (tests): new src/cli/tests/cage-scope.test.ts: session via .cage.yaml and via --allow-only keeps an in-scope
#        edit, restores a modified out-of-scope tracked file, removes a new non-ignored out-of-scope file, restores a
#        deleted one, keeps a gitignored file outside the scope, still restores .env inside the scope; flag and
#        config intersect; invalid allow_only and a non-git dir exit 2; the real index (git status) is unchanged; the
#        executable bit survives a restore; kill -9 recovery restores an out-of-scope change; the push guard refuses
#        a push of an out-of-scope path. cage check: base allow_only fails a range touching an out-of-scope path; a
#        head that adds allow_only is not held to it in its own range; --allow-only works without .cage.yaml.
#        cage watch: an out-of-scope change is prompted and restored on reject. npm run test:cage passes, with
#        gantry-cage --allow-only covered in packages/opengantry-cage/tests/.
# DoD 7 (ADR): ADR-0048 stays ACTIVE and gains decision 10 (scope mode): config key and flag, intersection,
#        out_of_scope semantics, git tree baseline, plan-bound session and base-read check, and the limits
#        (restore not block, gitignored files not seen, not a mission contract).
# DoD 8 (docs): docs/cage/ documents the allow_only key, --allow-only, the out_of_scope rule, the git baseline and
#        the limits (cage-yaml, protected-paths, session, check, watch, report, limits, index as needed);
#        packages/opengantry-cage/README.md lists --allow-only; docs/CHANGELOG.md Unreleased entry.
# DoD 9 (gate): ./scripts/dev-validate-core.sh passes (dev-validate-core OK).
