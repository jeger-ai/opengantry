interrogation:
  - finding_id: 4367eadf9a61
    kind: adr_conflict
    question: Intent may relate to ADR-0048. Accept ADR decision, reject
      applicability, or cite superseding rationale?
    hypothesis: Operator explicitly accepts or rejects ADR ADR-0048 before
      legislation proceeds.
    operator_answer: "Accept and amend: ADR-0048 stays ACTIVE and gains decision 10
      (scope mode). It fits decisions 1-2: a scope only adds protection.
      .cage.yaml top-level allow_only: [globs] and the repeatable --allow-only
      <glob> flag (session, watch, check) define the allowed area; when both are
      given a path must match both, so neither can widen the other. Every path
      outside it that git would track (tracked files and untracked files that
      are not gitignored) gets a new built-in out_of_scope rule in revert mode;
      gitignored files outside the scope (node_modules, build output) are not
      policed, and .git stays under git_control. Built-in rules still apply
      inside the scope and win. Decision 3 holds: --allow-override <path> can
      relax an out-of-scope path for one session run, announced. Decision 5
      holds: the scope is part of the session plan, the serialized push-guard
      plan and the journal, so an in-session .cage.yaml edit cannot change it;
      cage check reads allow_only from the base commit (ADR-0050) and
      --allow-only narrows it further. Decision 8 is not weakened: the
      out-of-scope baseline is a git tree written to the repository object store
      through a temporary index (the real index is untouched), not in-memory
      bytes, so it has no memory cap; outside a git work tree a scope run
      refuses with exit 2. Limits stated in the amendment: cage restores rather
      than blocks, a scope does not see gitignored files, and it is not a
      mission contract (ADR-0045)."
    adr_refs:
      - ADR-0048
      - ADR-0050
  - finding_id: d585ecf2924b
    kind: risk_escalation
    question: "Triage escalated: No confident skill_key match in intent (ambiguous
      or missing). Which skill_key and TMVC scope authorize this work?"
    hypothesis: Planner assigns explicit skill_key and narrows TMVC in the mission
      after operator confirmation.
    operator_answer: "substrate (Tier-3), as for MSN-0267, MSN-0268 and MSN-0275:
      the change spans the cage runtime under src/cli/lib/cage/, the cage
      command wiring, an ADR-0048 amendment, docs/cage/ and the slim package
      README and tests. TMVC is narrowed by contract.tmvc_roots to exactly those
      paths plus the cage test files, EXECUTOR_LOG.md, docs/CHANGELOG.md,
      README.md and this mission file."
    adr_refs:
      - ADR-0048
      - ADR-0050
  - finding_id: e98547caadb1
    kind: adr_conflict
    question: Intent may relate to ADR-0045. Accept ADR decision, reject
      applicability, or cite superseding rationale?
    hypothesis: Operator explicitly accepts or rejects ADR ADR-0045 before
      legislation proceeds.
    operator_answer: "Accept; ADR-0045 stays ACTIVE and unchanged. The cage scope is
      deliberately separate from the mission contract (operator decision): it is
      the no-mission tier, a plain glob list in .cage.yaml or on the command
      line, with no Planner seal, no contract_sha256, no import rules and no
      trace. It neither reads nor writes mission contracts, and gantry verify
      ignores it. The ADR-0048 amendment and docs/cage say when to use which:
      cage scope restores or fails changes outside an allowed area; a mission
      contract is Planner-approved scope with evidence. Reading a mission
      contract.tmvc_roots as a cage scope is left to a later mission."
    adr_refs:
      - ADR-0045
  - finding_id: f3eeaaa19de6
    kind: adr_conflict
    question: Intent may relate to ADR-0047. Accept ADR decision, reject
      applicability, or cite superseding rationale?
    hypothesis: Operator explicitly accepts or rejects ADR ADR-0047 before
      legislation proceeds.
    operator_answer: "Accept; ADR-0047 stays ACTIVE and unchanged. The new top-level
      allow_only: key goes into the existing human-written .cage.yaml, parsed by
      the existing yaml loader in cage-config.ts: YAML 1.2 core schema, aliases
      rejected, unknown keys, an empty list, non-string entries and absolute or
      .. globs rejected with GXT_CAGE_CONFIG_INVALID. The git tree baseline is
      an object in the repository object store, not a new file format; reports
      stay JSON."
    adr_refs:
      - ADR-0047
