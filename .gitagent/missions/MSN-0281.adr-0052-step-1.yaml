# OpenGantry mission scaffold (Planner: fill gate, TMVC narrowing, trace rows).
# Legislated by Planner stamp [MSN-0281]. Executor must not run until the [MSN-0281] legislation commit + pin.
# Renumbered from MSN-0280: PR #230 (Planner allowlist, GitHub noreply) took MSN-0280 on main while this mission was
# local; the branch was rebuilt on that main with the same contract and answers.
#
# Legislated intent: ADR-0052 migration step 1. Freeze the v3.9 behaviour as a conformance suite, write the five
# registries (B3) and record the first per-layer baseline (B4). No src/cli change, no B2 rule kind in
# TARGET_ARCHITECTURE.yaml (the v3.9 parser rejects a rule with neither import nor pattern fields; step 3 ships the
# evaluator and activates them), no new dependency (#227 freeze).
#
# Operator decisions (2026-10-17): registries at .gitagent/registry/ inside the governed substrate; the dependency
# registry tracks devDependencies as well as dependencies; the conformance suite runs in CI from this step; one env
# registry with a prefix field covering GANTRY_, GXT_ and the deprecated GAPMAN_ names. Gate stays the allowlisted
# ./scripts/dev-validate-core.sh, extended to run npm run test:conformance.
#
# DoD 1 (registries): .gitagent/registry/{error-codes,env,commands,mcp-tools,dependencies}.yaml, each
#        schema: opengantry.registry.v1 with kind and entries [{name, since, note?}] (env: prefix; commands: hidden?;
#        dependencies: scope runtime|dev, native?). YAML 1.2 core, no aliases. Every entry carries since (MSN or ADR
#        id). A diff of each registry against the live inventory is empty: 82 GXT_* codes from gxt-error-codes.ts,
#        every GANTRY_/GXT_/GAPMAN_ env name read in src/cli (GAPMAN_ marked deprecated: 4.0), 86 Commander
#        subcommands, 21 gxt_* MCP tools, 9 runtime and 7 dev dependencies (better-sqlite3 and sqlite-vec native).
# DoD 2 (protection): MANIFEST.json perimeter_protected gains .gitagent/registry/ and ARCH_BASELINE.json; the gantry
#        skill forbidden_zones gains .gitagent/registry/; gantry check passes; gantry cage check --base origin/main on
#        a throwaway commit that edits a registry exits 3 (commit discarded afterwards).
# DoD 3 (layers): TARGET_ARCHITECTURE.yaml delivery layer globs widened to src/cli/index.ts, src/cli/program*.ts,
#        src/cli/cage-bin.ts and src/cli/kernel.ts so every src/cli/**/*.ts file (tests excluded) is in exactly one
#        layer; rules untouched; gantry arch check over the full tree passes unchanged.
# DoD 4 (baseline): ARCH_BASELINE.json at the repository root, schema opengantry.arch-baseline.v1, with commit,
#        file_ceiling_lines 800 and per-layer files, lines and export-statement counts; scripts/arch-baseline.mjs
#        reads the layer globs from TARGET_ARCHITECTURE.yaml and, run at the recorded commit, reproduces the file
#        byte for byte (node scripts/arch-baseline.mjs --check exits 0). The file is machine-written; the script is
#        removed by step 3 when gantry arch check --ratchet exists.
# DoD 5 (conformance): test/conformance/ with README.md, cases.yaml, fixtures/ (fresh-init, mission-pass,
#        mission-fail-gate, mission-stale, cage-tamper, contract-standalone), golden/, build-fixtures.mjs and
#        run.test.mjs using node:test only. cases.yaml lists every public subcommand; every one that takes --json has
#        at least one case, plus verify --format sarif and --format junit on mission-pass; hidden subcommands are
#        listed with fold: gantry hook. Each case records exit code, normalized stdout and the set of [GXT_*] codes on
#        stderr; normalizers (timestamps, absolute paths, shas, durations, digests) are per case. The suite passes
#        against the built v3.9 CLI; golden files are recorded once (--record) and not re-recorded in this mission.
# DoD 6 (inventory): test/conformance/spawning-tests.yaml classifies all 32 src/cli/tests files that spawn a process as
#        cli (drives dist/cli/index.js) or script (drives a file under scripts/).
# DoD 7 (wiring and docs): package.json script test:conformance (no dependency change; npm install
#        --package-lock-only reproduces the lockfile); scripts/dev-validate-core.sh runs it after unit tests so the
#        gate and npm run validate both exercise it; docs/DEVELOPMENT.md section "Registries, baseline and
#        conformance (ADR-0052 step 1)"; docs/CHANGELOG.md substrate note under Unreleased.
# DoD 8 (gate): ./scripts/dev-validate-core.sh passes (dev-validate-core OK) with the conformance suite included;
#        git diff --name-only origin/main..HEAD lists only paths under contract.tmvc_roots.
