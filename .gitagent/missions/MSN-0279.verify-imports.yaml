# OpenGantry mission scaffold (Planner: fill gate, TMVC narrowing, trace rows).
# Legislated by Planner stamp [MSN-0279]. Executor must not run until the [MSN-0279] legislation commit + pin.
#
# Legislated intent: mission B of the standalone verify (ADR-0051 follow-up B): import and layer rules that
# understand JS/TS and Python imports, repository law that also binds task-level gate.json contracts, and signed
# results. Revised after operator review on 2026-10-17: path aliases for TS/Angular, Python from-import submodule
# resolution with __init__.py, gate.json inheriting the base verify.yaml, and no new signature schema (receipt
# envelope, compatible with the ADR-0052 RunRecord). MSN-0278 is taken by ADR-0052 in another worktree. Branch cut
# from msn-0277-verify-contract (PR #228); the PR opens against main after #228 merges.
#
# Constraints: one JS/TS scanner (src/cli/lib/import-scanner.ts, read-only here); one signing module
# (src/cli/lib/receipt-signing.ts, extended only by an allowed-signers verify path); mission verify (src/cli/lib/
# verify/) and the cage untouched; no network call (Sigstore keyless is a follow-up); results digest-only.
#
# Amended 2026-10-17 (Planner, at the operator's choice): src/cli/lib/verify/ removed from contract.forbidden_zones.
#        A forbidden zone also bans imports into it, and src/cli/program-workflow.ts (in scope) has always imported
#        verify-options.js and verify-export.js from there. Mission verify stays untouched: no file under
#        src/cli/lib/verify/ may change in this mission.
# Amended 2026-10-18 after ADR-0052 step 1 (MSN-0281) and MSN-0277 landed on main: .gitagent/registry/error-codes.yaml
#        and test/conformance/golden/ join the contract.
# DoD 13 (law of ADR-0052 step 1): GXT_VERIFY_SIGN_NO_KEY has an error-codes.yaml entry (since MSN-0279) in the
#        Planner commit; the golden files verify.contract.contract-standalone and
#        verify.contract.gate-json.contract-standalone are re-recorded for the result fields of DoD 8 (inherited,
#        imports, layers, skipped) and no other golden file changes; npm run test:conformance passes.
# DoD 1 (parsing): JS/TS (.ts .tsx .js .jsx .mjs .cjs .mts .cts) through import-scanner.ts: static imports,
#        export ... from, require and import() with a string literal. Python (.py) through a new parser: import a.b,
#        from a.b import c, d, relative from . import x / from ..m import y, parenthesized multi-line imports,
#        comments and strings ignored. from X import Y yields the module X and the candidates X.Y for every name.
#        Files of another type matched by an imports or layers rule are listed as skipped in the result.
# DoD 2 (new only): each changed file's imports at HEAD (from disk with --worktree) are compared with the same file
#        at the base; only imports the change adds count.
# DoD 3 (resolution): JS/TS relative specifiers resolve to the path, then the extensions above, then index.*; a
#        specifier starting with a path_aliases key is rewritten to its repo path and resolved the same way; other
#        bare specifiers are packages and are no layer imports. Python from X import Y tries X/Y.py, X/Y/__init__.py,
#        then X.py and X/__init__.py; import X.Y tries X/Y.py and X/Y/__init__.py; absolute imports under each
#        python_paths root (default the repository root), relative imports from the importing file's package.
# DoD 4 (imports rules): imports: [{name, files, forbid: [module prefixes], why?}]; a new import whose module or
#        candidate equals a forbid entry, or starts with it plus "/" (JS/TS) or "." (Python), fails, reported as
#        file:line spec.
# DoD 5 (layers rules): layers: [{name, paths, may_not_import?}]; a new import from a file in layer A that resolves
#        into layer B fails when B is in A's may_not_import, reported as file:line spec -> resolved path. Unknown
#        layer names, duplicate layers and invalid aliases or python_paths exit 2 (GXT_VERIFY_CONTRACT_INVALID).
# DoD 6 (repository law): when the contract is not the repository's own verify.yaml and the base commit has a root
#        verify.yaml, its imports, layers, path_aliases, python_paths, rules and forbidden_paths are merged in,
#        tighten-only (rules and paths unioned; on conflicting aliases or python_paths the repository entry wins);
#        checks, size and allowed_paths stay the task contract's. The result names the inherited contract (path,
#        sha256). gate.json gains no keys.
# DoD 7 (signing): --sign (with --out) adds a signature block in exactly the ReceiptSignature shape of
#        receipt-signing.ts (kind, signature_b64, payload_encoding canonical_json_utf8, key_fingerprint,
#        signer_principal) over the canonical JSON of the result without it, through signReceiptMessage; no key
#        configured exits 2. receipt-signing.ts can verify against a given allowed-signers file. --check-result <file>
#        --allowed-signers <file> requires a good signature and reports the signer; unsigned, tampered or wrongly
#        signed results fail.
# DoD 8 (result): opengantry.verify-result.v1 gains imports and layers findings, skipped files, the inherited
#        contract and the optional signature; digest-only (specifiers and repo paths, never source text).
# DoD 9 (tests): src/cli/tests/verify-standalone-imports.test.ts (JS/TS forms, Angular-style @app/ aliases, index.*,
#        Python submodule vs symbol, __init__.py packages, python_paths, relative imports, new vs existing imports,
#        gate.json inheriting the base verify.yaml) and verify-standalone-sign.test.ts (throwaway SSH key: sign,
#        verify against an allowed-signers file, tampered result, wrong signer, unsigned); existing verify suites pass.
# DoD 10 (ADR): ADR-0051 amended for DoD 1-8; Sigstore keyless as the next follow-up; ADR-0052 cited for the
#        signature envelope.
# DoD 11 (docs): docs/guides/verify-contract.md sections for imports, layers, path aliases, python_paths,
#        repository law for gate.json and signing; docs/CHANGELOG.md Unreleased entry.
# DoD 12 (gate): ./scripts/dev-validate-core.sh passes (dev-validate-core OK).
