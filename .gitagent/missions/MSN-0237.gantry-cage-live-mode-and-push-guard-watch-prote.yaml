# OpenGantry mission scaffold (Planner: fill gate, TMVC narrowing, trace rows).
# Legislated intent: gantry cage live mode and push guard: watch protected paths during the session and restore them as they change (default on, --no-watch to opt out; events to a session log outside the repo plus terminal bell, full report at exit; stop live-reverting a path after 3 reverts and restore it once at exit), and give the caged process tree a session-scoped core.hooksPath whose pre-push refuses outgoing commits that touch protected paths and chains to the repo's real hooks
msn_id: MSN-0237
skill_key: gantry
gate_command: ./scripts/dev-validate-core.sh
# DoD 1: watch is the default: a revert-rule change made while the command runs is restored during the session (not only
#        at exit) and logged; the exit report lists it; exit 3. Lockfiles stay report-only (tests).
# DoD 2: after 3 live restores of one path it is marked contested: no more live restores, restored once at exit (tests).
# DoD 3: live events go to a session log in the OS temp dir (path printed at start) plus a terminal bell; no other text is
#        written while the command runs (tests).
# DoD 4: --no-watch keeps the after-exit-only behavior; existing cage tests pass unchanged in intent (tests).
# DoD 5: push guard: the caged process tree gets a session core.hooksPath (GIT_CONFIG_* env, temp dir outside the repo)
#        whose pre-push refuses outgoing commits touching revert-rule paths and chains to the repo's real hooks; the temp dir
#        is removed at exit and nothing is written to the repo (tests).
# DoD 6: ./scripts/dev-validate-core.sh passes (dev-validate-core OK).
