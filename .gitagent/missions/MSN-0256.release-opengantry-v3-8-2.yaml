#        packages["packages/opengantry-cage"]), packages/opengantry-cage/package.json,
#        .gitagent/foreman/SUBSTRATE.version.json, templates/.gitagent/foreman/SUBSTRATE.version.json and
#        templates/integrations/compatibility.json; no 3.8.1 left in those files; `gantry --version`, the
