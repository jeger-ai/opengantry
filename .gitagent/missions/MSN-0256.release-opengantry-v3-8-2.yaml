#        "From v3.8.1 (… — v3.8.2)" with `npm install @jeger-ai/opengantry@3.8.2` and
#        `npx @jeger-ai/opengantry-cage@3.8.2`; the substrate note says CLI 3.8.2; no "Unreleased" left.
# DoD 3 (README): a **v3.8.2:** line above the v3.8.1 line.
# DoD 4 (scope + packaging): the diff against main touches only the contract files and the mission file;
#        no src/ change; `npm run pack:check` OK and `npm run test:cage` passes for the 3.8.2 tarball.
# DoD 5 (gate): `./scripts/dev-validate-core.sh` passes (dev-validate-core OK).
#
# After merge (Planner, not this mission): push tag v3.8.2 to trigger npm-publish.yml, which publishes both
# packages. The first publish of @jeger-ai/opengantry-cage needs an NPM_TOKEN allowed to create that name.
