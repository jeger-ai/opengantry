#
# Legislated intent: Release OpenGantry v3.8.2: cage signal trap and kill -9 journal recovery (MSN-0253),
# fail-closed size caps (MSN-0254), the slim @jeger-ai/opengantry-cage package (MSN-0252), ADR-0049 (MSN-0250)
# and the follow-ups (MSN-0255); version parity 3.8.2 including the slim package; the Unreleased changelog
# row and upgrade notes become v3.8.2 and call out the two behaviour changes in a patch release (precedent:
# v3.8.1); README v3.8.2 line.
