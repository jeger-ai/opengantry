#        substrate version matching the bundled gantry. examples/iii-integration/package-lock.json is out of
#        scope (it snapshots the root package only when that lockfile is regenerated).
# DoD 2 (CHANGELOG): the **Unreleased** release-highlights row becomes **v3.8.2** with "Behaviour changes in
