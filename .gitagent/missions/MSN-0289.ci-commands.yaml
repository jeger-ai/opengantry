# gxt-manifest-lib.mjs with scripts/lib (path-scoped [MSN] subjects with gxt-bypass notes and trusted automation,
# mission purity and the mission requirement over a PR range, the upgrade staging guard). The trusted-automation
# evaluator is pure core code; the workflow template, its mirror and the dev gate call gantry ci; the six scripts, their
# template copies and the four script-driven tests are deleted; the init catalog no longer ships them, so the init and
# blueprint goldens are re-recorded (the one deliberate contract change of this step).
#
# Operator direction (2026-10-18, "merge and continue until everything is done"): same rules, same messages; the
# runtime helper scripts (gxt-resolve/pin-mission.sh, gxt-cursor-env.sh, the Cursor session hook) follow in 5b-ii.
# No trace rows: the evidence is .gitagent/runs/MSN-0289.json written by gantry verify --record (RULES §3).
#
# DoD 1 (core): packages/core/src/trusted-automation.ts exports parseTrustedAutomationRules (shape, one structural
#        kind per rule, hard caps 5 and 100), msnEnforcedPrefixes and isMsnEnforcedPath, parseNumstatTotal,
#        isValidBypassNote, workflowVersionPinOnly, isSubstrateHardDeniedPath, pathMatchesAllowed, evaluateAgainstRule
#        and evaluateTrustedAutomation; packages/core/tests/trusted-automation.test.ts; core index exports it.
# DoD 2 (lib): src/cli/lib/trusted-automation.ts loads the config, reads git (changed files, author, numstat, blobs)
#        and judges a commit or a range; src/cli/lib/ci-checks.ts holds checkMsnRange (subject, bypass note, trusted
#        automation), checkUpgradeTmp and missionsForRange (contamination, purity, mission required unless trusted).
# DoD 3 (command): src/cli/commands/ci.ts and program-ci.ts register gantry ci msn-range, verify-missions (full
#        verify per changed mission, audience verifier), trusted-automation (--commit or --base/--head) and upgrade-tmp;
#        --base/--head fall back to BASE_SHA/HEAD_SHA; program.ts wires it.
# DoD 4 (callers): templates/.github/workflows/gxt-validate.yml and its mirror drop the Node-parity manifest step and
#        call gantry ci msn-range (the msn_commits job builds gantry first) and gantry ci verify-missions;
#        scripts/dev-validate-core.sh runs gantry ci upgrade-tmp and gantry ci msn-range; templates/scripts/dev-validate.sh
#        and its copy run gantry ci verify-missions.
# DoD 5 (removal): scripts/validate-gxt.sh, scripts/verify-pr-missions.sh, scripts/gxt-manifest-lib.mjs and
#        scripts/lib/{glob-match,manifest-validate,trusted-automation}.mjs are deleted with their templates/scripts copies;
#        scripts/lib/asset-catalog-static.mjs and templates/integrations/asset-catalog.json no longer list them;
#        TARGET_ARCHITECTURE.yaml's duplicate rule drops the six pairs; .gitagent/registry/commands.yaml gains ci,
#        ci msn-range, ci trusted-automation, ci upgrade-tmp, ci verify-missions (since MSN-0289).
# DoD 6 (tests): src/cli/tests/ci-msn-range.test.ts and ci-verify-missions.test.ts port validate-gxt.test.ts and
#        verify-pr-missions.test.ts; trusted-automation.test.ts drives gantry ci; manifest-lib-boundary and
