# OpenGantry mission scaffold (Planner: fill gate, TMVC narrowing, trace rows).
# Legislated by Planner stamp [MSN-0270]. Executor must not run until the [MSN-0270] legislation commit + pin.
#
# Legislated intent: docs overhaul. docs/ reads as maintainer notes: FEATURES.md is 35 KB with 35 ADR links,
# ADOPTION.md opens with the enterprise control plane before the first run, INTEGRATIONS.md puts nine tools on one
# page, and pages carry their own navigation (Product home / All docs lines, When-to-read tables, How: chains) on
# top of the opengantry.ai sidebar. The cage and the full OpenGantry stack are mixed on the same pages. This
# mission restructures docs/ by audience and topic so opengantry.ai can build navigation from frontmatter. The site
# change (recursive fetch, frontmatter nav, redirects from moved_to) is a separate mission in jeger-ai/opengantry.ai;
# production keeps pinning v3.8.3 until then, so nothing published breaks when this merges. The next npm release
# waits until the site mission is live, because the slim README links to opengantry.ai/docs/cage/.
#
# Constraint: no new product facts. Every statement on a new page comes from the pre-mission docs/, README.md, the
# slim README, an ADR or src/cli/; content that is dropped is listed in the trace, not deleted silently. No shipped
# code, template, workflow or substrate file changes (contract forbidden_zones).
#
# DoD 1 (layout): docs/ holds index.md plus these sections, content redistributed from ADOPTION, FEATURES,
#        INTEGRATIONS, KATA, DOMAINS, AGENT-GRAPH, CI, COMPLIANCE-ISO, USE-CASES and the README feature tour:
#          cage/       index (quickstart), protected-paths, cage-yaml, report (report, --json, exit codes, signals,
#                      kill -9 recovery, contested-file halt), limits (restores not blocks, platforms)
#          start/      install, first-mission (KATA + standard change graph), how-it-works (roles, mission graph)
#          guides/     cursor, claude-code, codex, other-agents, ci (SARIF/JUnit + CI receipt ingestion),
#                      agent-graphs (AGENT-GRAPH + remote handoff + context feed), content-domain, regulated-teams,
#                      org-control-plane, troubleshooting
#          concepts/   missions, scope (TMVC, forbidden zones, contracts, context-request), perimeters,
#                      verify (gates, typed adapters, findings[], --fix), trace-evidence, enforcement-boundary,
#                      when-to-adopt (personas, vs TDD + CI, vs alternatives, what OpenGantry is not)
#          reference/  mcp-tools, session-variables, metrics-and-report, break-glass, experimental, release-notes
#        File names in sections are lowercase-hyphenated. Any merge or split against this list is recorded in the
#        trace with its reason. docs/index.md is rewritten as a short landing page with two entry points (cage,
#        OpenGantry) and no When-to-read tables.
# DoD 2 (frontmatter): every docs/**/*.md outside docs/archive/ starts with frontmatter holding title, description
#        (at most 160 characters) and either section + order (published) or publish: false. MANIFESTO.md (section
#        about) and SECURITY.md (section reference) stay at their paths and stay published. DEVELOPMENT.md,
#        ARCHITECTURE.md, ADR-EPHEMERAL-VIRTUALIZATION.md, CHANGELOG.md and the new STYLE.md stay in the repo with
#        publish: false. Release highlights move from CHANGELOG.md to reference/release-notes.md (one source);
#        CHANGELOG.md keeps upgrade notes and gains an Unreleased entry naming the new layout and the moved pages.
# DoD 3 (moved pages): ADOPTION, FEATURES, INTEGRATIONS, KATA, DOMAINS, AGENT-GRAPH, CI, COMPLIANCE-ISO and
#        USE-CASES stay at their old paths with publish: false and moved_to: (the new pages). Each body is at most
#        20 lines mapping its former sections, including FEATURES#zero-config-cage-gantry-cage and
#        ADOPTION#step-zero-cage-an-agent-you-already-use, to new pages, so links from released CLI hints, shipped
#        templates, ADRs, workflow comments and past npm READMEs keep resolving on GitHub.
# DoD 4 (style contract): docs/STYLE.md states the rules: one page, one job; published pages at most 1,500 words
#        excluding frontmatter and fenced code; no navigation inside page bodies (no Product home / All docs lines,
#        When-to-read tables, How: or See also chains); no MSN-NNNN on published pages; ADR-NNNN only on one
#        trailing line starting "Design notes:"; cage pages stand alone and link only to other docs/cage/ pages plus
#        one link into docs/start/.
# DoD 5 (cage docs): the docs/cage/ pages restate cage behaviour from FEATURES § Zero-config cage, ADOPTION § Step
#        zero, packages/opengantry-cage/README.md and ADR-0048 without changing any rule, mode, cap, flag or exit
#        code; each flag or exit code named matches src/cli/lib/cage/ (checked in the trace).
# DoD 6 (inbound links): README.md is rewritten to pitch, cage quickstart, install and links into docs/ (at most
#        150 lines). packages/opengantry-cage/README.md links to https://opengantry.ai/docs/cage/ pages instead of
#        GitHub FEATURES/ADOPTION anchors. The four examples/*/README.md files link to the new pages.
# DoD 7 (gate): new scripts/assert-docs-structure.mjs (node: imports only) enforces DoD 2-4 and that every relative
#        .md link and #anchor (GitHub heading slugs) in docs/**, README.md, packages/opengantry-cage/README.md and
#        examples/*/README.md resolves, and that every moved_to target exists. scripts/assert-docs-deterministic.sh
#        runs it, and its REQUIRED_DOCS list matches the new layout. The trace shows the checker failing on one
#        seeded violation per rule (missing frontmatter, oversized page, nav line, MSN ref, stray ADR ref, broken
#        anchor, cage page linking outside cage/ and start/, missing moved_to target) and passing on the tree.
# DoD 8 (gate): ./scripts/dev-validate-core.sh passes (dev-validate-core OK).
# Amended by Planner stamp: declared_paths added (this mission file plus the contract roots) after verify reported
#        GXT_INTERROGATION_PATH_DRIFT for the mission file; scope, gate, DoDs and contract unchanged.
