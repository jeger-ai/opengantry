  - finding_id: 2121e0ae69d9
    kind: adr_conflict
    question: Intent may relate to ADR-0037. Accept ADR decision, reject
      applicability, or cite superseding rationale?
    hypothesis: Operator explicitly accepts or rejects ADR ADR-0037 before
      legislation proceeds.
    operator_answer: Reject applicability; ADR-0037 stays ACTIVE and unchanged. It
      matched only on CI. The dependency freeze changes how cage classifies
      lockfiles and dependency manifests locally (session, watch, check); it
      emits no envelope or receipt, touches no control plane, ingestion
      workflow, pepper or attestation path, and this mission adds no workflow
      (.github/workflows/ and templates/ are forbidden).
    adr_refs:
      - ADR-0037
  - finding_id: 4367eadf9a61
    kind: adr_conflict
    question: Intent may relate to ADR-0048. Accept ADR decision, reject
      applicability, or cite superseding rationale?
    hypothesis: Operator explicitly accepts or rejects ADR ADR-0048 before
      legislation proceeds.
    operator_answer: "Accept and amend: ADR-0048 stays ACTIVE and gains decision 9
      (dependency freeze). It fits decisions 1-2: the freeze only tightens. The
      built-in lockfile rule stays report by default; .cage.yaml top-level
      dependencies: revert or the --lock-deps flag switches the lockfile rule
      and a new dependency_manifest rule (package.json, pyproject.toml, Pipfile,
      requirements*.txt, Cargo.toml, go.mod, Gemfile, composer.json) to revert.
      dependencies: report is the default and loosens nothing. Decision 3 holds:
      --allow-override <path> can still downgrade a frozen path to report for
      one run and is announced. Decision 5 holds: the setting is part of the
      session plan, so an in-session .cage.yaml edit cannot change it; cage
      check reads it from the base commit like every other rule (ADR-0050), and
      --lock-deps on check can only add. Decision 8 holds: frozen files are
      revert-rule bytes, so a lockfile over --max-file-bytes stops the run with
      GXT_CAGE_FILE_TOO_LARGE; documented. The amendment states the limit
      plainly: cage restores files, it does not block, so a postinstall script
      has already run when package.json is restored; the freeze keeps an
      injected dependency out of commits and PRs, it does not stop install-time
      execution on the machine."
    adr_refs:
      - ADR-0048
