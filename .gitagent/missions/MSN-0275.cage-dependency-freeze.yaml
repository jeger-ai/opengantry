# OpenGantry mission scaffold (Planner: fill gate, TMVC narrowing, trace rows).
# Legislated by Planner stamp [MSN-0275]. Executor must not run until the [MSN-0275] legislation commit + pin.
#
# Legislated intent: an opt-in dependency freeze for gantry cage. Lockfiles are report-only today, so an agent (or a
# compromised model router in front of it) can add or swap a dependency and the change reaches the commit.
# When a task needs no new packages, the project or the run freezes dependencies: lockfiles and dependency manifests
# become revert-rule paths in the session, watch and check.
#
# Constraints: built-in defaults unchanged (freeze off = today's behaviour, byte for byte). The freeze only tightens
# (ADR-0048 decisions 1-2). No MCP tool, no workflow, no adopter template (.github/workflows/ and templates/ are
# forbidden). packages/opengantry-cage/src/ is forbidden: the slim bin gets --lock-deps through the shared
# src/cli/program-cage.ts. Honest limit, stated in ADR and docs: cage restores, it does not block; a postinstall
# script has already run when package.json is restored. The freeze keeps an injected dependency out of commits and
# PRs, not off the machine.
#
# DoD 1 (config): .cage.yaml takes a top-level dependencies: revert|report (default report). Any other value exits 2
#        with GXT_CAGE_CONFIG_INVALID. The resolved setting is part of the cage plan and of the serialized plan the
#        session push guard reads.
# DoD 2 (flag): --lock-deps on the session (gantry cage -- <cmd>, gantry-cage), cage watch and cage check turns the
#        freeze on for that run whatever .cage.yaml says. It can only tighten: there is no flag that turns it off.
# DoD 3 (rules): with the freeze on, the built-in lockfile rule (the 13 existing names) is revert, and a new built-in
#        dependency_manifest rule (package.json, pyproject.toml, Pipfile, requirements*.txt, Cargo.toml, go.mod,
#        Gemfile, composer.json; basename match in the whole-tree scan with the existing skip dirs) is revert.
#        Session: modified restored, added removed, deleted restored; watch prompts; check exits 3; push guard blocks.
#        With the freeze off, lockfiles stay report and manifests are unprotected, exactly as before.
#        --allow-override <path> can still downgrade a frozen path for one run and is announced (decision 3).
# DoD 4 (reports): rows name rule lockfile or dependency_manifest (source builtin). The session report,
#        gantry.cage-check.v1 and gantry.cage-watch.v1 gain an additive dependencies: "revert"|"report" field.
#        Digest-only, no file bodies.
# DoD 5 (tests): src/cli/tests/cage.test.ts: freeze via .cage.yaml and via --lock-deps restores a modified
#        package-lock.json, removes a new sub/package.json, restores requirements-dev.txt; freeze off keeps a
#        lockfile change and leaves package.json alone; dependencies: maybe exits 2; an in-session .cage.yaml edit that
#        adds dependencies: revert does not freeze the running session; --allow-override package-lock.json under the
#        freeze keeps the change, reported as overridden; a .env.local created in the session is removed (roadmap #6).
#        src/cli/tests/cage-check.test.ts: base with dependencies: revert and a head changing package.json exits 3;
#        a head that adds dependencies: revert does not apply it to its own range; --lock-deps without .cage.yaml
#        exits 3 on a lockfile change; a committed .env.local exits 3. src/cli/tests/cage-watch.test.ts: a frozen
#        lockfile change is prompted and restored on reject or timeout. npm run test:cage passes, with gantry-cage
#        --lock-deps covered in packages/opengantry-cage/tests/.
# DoD 6 (ADR): ADR-0048 stays ACTIVE and gains decision 9 (dependency freeze): config key and flag, tighten-only,
#        rules from base for check, plan-bound for the session, decision 8 cap applies to frozen lockfiles, and the
#        restore-not-block limit for install-time scripts.
# DoD 7 (docs): docs/cage/cage-yaml.md, protected-paths.md, session.md, check.md, watch.md and limits.md document the
#        key, the flag, the dependency_manifest rule and the limit; docs/FEATURES.md cage section;
#        packages/opengantry-cage/README.md lists --lock-deps; docs/CHANGELOG.md Unreleased entry.
# DoD 8 (gate): ./scripts/dev-validate-core.sh passes (dev-validate-core OK).
