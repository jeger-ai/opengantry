# OpenGantry mission scaffold (Planner: fill gate, TMVC narrowing, trace rows).
# Legislated by Planner stamp [MSN-0395]. Executor must not run until the [MSN-0395] legislation commit + pin.
#
# Legislated intent: issue #356, the two owner decisions of 2026-11-17 after the first full-sandbox probe (MSN-0391
# probe in policy mode, srt 0.0.83, seccomp helper applied, after the owner installed /etc/apparmor.d/bwrap and
# disabled bwrap-userns-restrict on the host). (1) write-inherited-fd becomes a positive check: inside the sandbox the
# shell's /proc/$$/fd is listed before any pipe exists; no fd above 2 is blocked ("no inherited fd above 2 reached the
# sandbox"); an fd above 2 is written through and judged, and any fd above 2 outside the allowed areas is effect; the
# observed fd list is recorded in the canary detail. Both branches tested; the effect branch through a harness that
# hands the real canary script an inherited fd outside any sandbox. (2) gantry cage policy --strict-network adds
# sandbox.network.strictAllowlist: true (the key in Claude Code's settings reference and srt's config schema); the
# default fragment and its golden stay unchanged; gantry admission probe --strict-network (and capabilities --probe
# --strict-network) probes that policy; network.connect is prevention only under a strict policy with every network
# canary blocked. Re-run the probe on this host in both modes and record the verdicts, digests, host facts and the
# AppArmor prerequisite (commands, undo, trade-off) in ADR-0063, coverage row U and the probe guide. The static
# capability matrix cannot express a host prerequisite, so its cells stay unchanged.
# No CI workflow change, no system configuration change, no registry change (commands.yaml has no flag field).
#
# Operator brief (2026-11-17, orchestrator brief for issue #356, MSN-0395; interrogation answers written by the agent
# from it).
# Re-legislated 2026-11-17 before any work commit: src/cli/tests/admission-probe-host.test.ts added (the host integration
# test pins the old inconclusive inherited-fd result and gains a --strict-network run).
# Amended (PR #379 review round): packages/core/src/schemas/admission-schema.ts and the published
# schemas/admission/admission-capabilities.v1.schema.json declared. The review found that the canary evidence of a
# proven cell shows no host prerequisite; its closed host object gains optional nestedUserns and the AppArmor bwrap
# profile state, so the published schema regenerates with them. The same round plants the inherited fd past a gap
# (fd 20 with 3-19 closed), narrows the fd judge to out/ and the temp dir, adds the network canaries and the notes.
# No trace rows: the evidence is .gitagent/runs/MSN-0395.json written by gantry verify --record (RULES §3).
