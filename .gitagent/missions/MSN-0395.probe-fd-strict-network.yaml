      Operator request (2026-11-17, orchestrator brief for issue #356,
      MSN-0395): 'make the two owner decisions from the first full-sandbox probe
      real, re-run the probe, and record the proven cells.' The agent wrote
      these answers from that brief."
    adr_refs:
