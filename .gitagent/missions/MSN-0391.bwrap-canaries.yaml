# OpenGantry mission scaffold (Planner: fill gate, TMVC narrowing, trace rows).
# Legislated by Planner stamp [MSN-0391]. Executor must not run until the [MSN-0391] legislation commit + pin.
#
# Legislated intent: issue #356 slice 4: prove or disprove the Claude Code sandbox on Ubuntu 26.04 with canaries.
# Disposable local canaries run @anthropic-ai/sandbox-runtime (srt, operator-supplied, not a dependency) with the
# settings gantry cage policy --agent claude-code generates, translated as Claude Code documents, and check from
# outside that each forbidden effect (artifact.read, workspace.write, network.connect, process.spawn,
# dependency.materialize; symlink, hardlink, /proc/self/root, .., nested sh/node/python, inherited fd, symlink swap,
# user namespace, unix-socket transport, npm postinstall) did not happen. A pure core mapping turns a probe record
# into capability cells: prevention only when the full mechanism with its seccomp helper ran on the target host, its
# control passed and every canary of the family and every cross-family transport canary was blocked; otherwise the
# static cell stays. Hidden gantry admission probe (refuses where the bwrap nested user namespace prerequisite is
# missing; --diagnostic runs the helper-less configuration and can never yield prevention), gantry admission
# capabilities --probe, a gantry doctor warning for the prerequisite, and gantry cage policy adds
# sandbox.failIfUnavailable so a sandbox that cannot start refuses instead of running unsandboxed. Canary evidence
# gains an optional host field. Docs: ADR-0063 status, coverage row U, an operator guide, CHANGELOG and release notes.
# No CI workflow change, no system configuration change.
#
# Operator brief (2026-11-17, orchestrator brief for issue #356 slice 4; interrogation answers written by the agent
# from it). Host facts found before legislation: Ubuntu 26.04.1, kernel 7.0.0-43, bwrap 0.11.1,
# kernel.apparmor_restrict_unprivileged_userns = 1 with the stock bwrap-userns-restrict profile loaded (bwrap itself
# runs), socat not installed, and a nested capability-bearing user namespace inside bwrap refused (the sandbox-runtime
# seccomp helper needs one).
# Re-legislated 2026-11-17 after PR #370 merged: docs/cage/policy.md added (the page documents the generated fragment,
# which gains sandbox.failIfUnavailable); the broker-socket canary needs no new path.
# No trace rows: the evidence is .gitagent/runs/MSN-0391.json written by gantry verify --record (RULES §3).
msn_id: MSN-0391
