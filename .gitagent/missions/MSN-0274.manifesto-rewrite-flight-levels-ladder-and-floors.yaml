# OpenGantry mission scaffold (Planner: fill gate, TMVC narrowing, trace rows).
# Legislated by Planner stamp [MSN-0274]. Executor must not run until the [MSN-0274] legislation commit + pin.
#
# Legislated intent: the docs-only follow-on of ADR-0049 decision 6. docs/MANIFESTO.md still pitches the flat
# two-role factory (Visionary and Architect) from August. Rewrite it so the north star matches what ships and how
# adoption works: the Architect function is federated across the technical flight levels through the tighten-only
# artifact chain; the Visionary function lives in product tools and enters only as mission intent and gate_command;
# adoption climbs a ladder of three steps, cage, then verify, then plane; and a short list of floors holds at every
# step. Keep the north-star argument (post-PR factory, referee instead of reviewer, the inner loop).
#
# Planner decisions recorded here:
# - The ladder steps are named cage, verify and plane, and are not labelled Tier 1/2/3: "Tier-1..3" already names
#   mission risk tiers, and docs/concepts/enforcement-boundary.md already has "Three tiers" for process boundary,
#   deterministic hook and advisory.
# - The cage halts on repeated tampering; iterative agent feedback belongs to verify. The page says so.
# - The optional external_ref field (ADR-0049 decision 4) stays out of scope.
# - ADR-0049 decision 6 names a README roles list; the docs restructure removed it, so the pointer is the README
#   Manifesto row.
#
# DoD 1 (who owns which law): the two-role section is replaced by a flight-level section: a table of the five
#        technical levels (Enterprise, System, Application, Module, Execution) with owner, what each decides and the
#        artifact that carries it; lower levels narrow and never widen; the Visionary enters only as intent and
#        gate_command, with epics and roadmaps in the product tool; Planner, Executor and Verifier stay process roles;
#        one person may hold several roles, and business and technical ownership are usually separate.
# DoD 2 (adoption ladder): a section names the three steps with what each protects and who it is for: cage (fixed
#        files such as CI config, .env and git hooks; no setup; halts on repeated tampering), verify (missions and
#        deterministic gates whose structured findings an agent retries on, the inner-loop feedback), plane (org
#        policy floor, digest-only ledger, cross-repository gates); each step links its published page.
# DoD 3 (floors): a section lists the floors that hold at every step: decisions are deterministic commands and exit
#        codes, never a model's judgment; invalid law fails closed before work runs; built-in cage rules cannot be
#        weakened from the working tree; lower levels only tighten; law is written outside the agent loop and
#        stamped in git; the executor never verifies its own work; the plane receives digests, never source or
#        plaintext identities.
# DoD 4 (consistency): every mechanism the page names exists and links its published page; forward-looking lines
#        read as direction, not as shipped behaviour; the bottleneck, referee and inner-loop sections stay.
# DoD 5 (style gate): frontmatter kept (section about, order 1, title, description); at most 1,500 words; no
#        mission ids; ADRs named only on one trailing Design notes line as GitHub links; relative links only to
#        published pages; assert-docs-structure OK.
# DoD 6 (README): the README docs table Manifesto row describes the new page (why, who owns which law, the
#        cage-verify-plane ladder); README links still resolve.
# DoD 7 (gate): ./scripts/dev-validate-core.sh && node scripts/assert-docs-structure.mjs passes.
