# OpenGantry mission scaffold (Planner: fill gate, TMVC narrowing, trace rows).
# Legislated by Planner stamp [MSN-0385]. Executor must not run until the [MSN-0385] legislation commit + pin.
#
# Legislated intent: close the follow-ups PR #365 (MSN-0381) left for issue #356 (ADR-0063 owner decision Q10):
# (1) the MCP launcher, the Cursor sessionStart hook and the runtime-env script run a pinned installed gantry
# outside the checkout through the same resolver block as the git hook shims (kept byte-identical by a test), never
# the working tree dist/ unless a human sets GANTRY_HOOK_LOCAL_BUILD=1; (2) CI counts a gxt-bypass break-glass note
# only when it is version 2, names the noted commit, and is SSH-signed by a key the base commit PLANNER.signing.pub
# lists for its signer; old unsigned notes stop counting, fail closed; (3) gantry cage policy also denies the
# physical path of every home-directory secret when a link makes it differ; (4) ADR-0063 consequences note;
# (5) changelog and release notes. No prevention claim without a proven harness sandbox.
# Amended: docs/guides/cursor.md declared; it described the launcher running dist/ when present.
# Amended: test/conformance/golden/init.dry-run.bare-git.json declared and re-recorded (CONFORMANCE_RECORD=1): it
# records the byte size of the docs/INTEGRATIONS.md that init composes from the Cursor recipe, whose launcher line changed.
#
# Operator brief (2026-11-16). No trace rows: the evidence is .gitagent/runs/MSN-0385.json written by
# gantry verify --record (RULES §3).
