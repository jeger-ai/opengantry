# OpenGantry mission scaffold (Planner: fill gate, TMVC narrowing, trace rows).
# Legislated intent: gantry cage per-project protection: additive-only .cage.yaml (protect paths/globs, strict schema, fail closed on unknown or subtractive keys, self-protected, source-labelled rules, aggregate target-count and snapshot-byte caps) and --allow-override <path> runtime flag that downgrades a built-in revert rule to report-only (never git_control or .cage.yaml), announced on stderr and in the JSON report, with push-guard parity
msn_id: MSN-0239
skill_key: gantry
gate_command: ./scripts/dev-validate-core.sh
# DoD 1: additive .cage.yaml at the cage root: single key protect:, entries {path} or {glob} (* within a segment, ** any
#        depth) with optional mode revert|report (default revert), unioned with built-ins and manifest forbidden_zones; no
#        file = behavior unchanged (tests).
# DoD 2: fail closed with exit 2 before the command runs on invalid YAML, unknown keys, subtractive keys (relax, exclude,
#        allow, ...), absolute or .. paths, and mode: report on a path a built-in rule already reverts (tests).
# DoD 3: .cage.yaml is always a revert target, present or absent: an in-session edit is restored and an in-session
#        creation is removed (tests).
# DoD 4: caps: more than 5000 resolved targets or more than 64 MiB aggregate snapshot bytes aborts before the command runs
#        and reports both counts (tests).
# DoD 5: --allow-override <path> (repeatable) downgrades a matching revert target to report; refused with exit 2 for
#        git_control, .cage.yaml and paths matching no protected target; stderr banner at start and in the exit summary;
#        JSON report overrides[] and overridden: true on affected change rows (tests).
# DoD 6: every plan target and report row carries source builtin | manifest | cage_yaml, added to gantry.cage-report.v1
#        without breaking existing readers (tests).
# DoD 7: push-guard parity: the push guard resolves the same plan as live restore: refuses .cage.yaml revert paths and
#        globs, allows overridden paths (tests).
# DoD 8: ./scripts/dev-validate-core.sh passes (dev-validate-core OK).
