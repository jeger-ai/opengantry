    kind: risk_escalation
    question: "Triage escalated: Intent contains risk_keyword: schema. Which
      skill_key and TMVC scope authorize this work?"
    hypothesis: Planner assigns explicit skill_key and narrows TMVC in the mission
      after operator confirmation.
    operator_answer: "skill_key gantry. 'schema' means the cage-local .cage.yaml
      format (protect entries only), not a database, mission or manifest schema.
      Contract narrows TMVC to src/cli/lib/cage/, src/cli/commands/cage.ts,
      src/cli/program-cage.ts, src/cli/tests/cage.test.ts and
      src/cli/tests/cage-watch.test.ts. Follows the ADR-0042 tighten-only floor:
      built-in rules are a floor, the repo file can only add; relaxation is a
      runtime flag that downgrades revert to report and is always reported.
      Report stays digest-only per ADR-0034. Tier-3: mandatory full human audit
      before merge."
    adr_refs:
