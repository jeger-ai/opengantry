#        file_ceiling_lines, layers), refusing a raise unless allowed; src/cli/tests/arch-structural.test.ts covers the
#        kinds, a whole-tree run, the partial-list exemption and the ratchet.
# DoD 3 (command): gantry arch check runs the whole-tree kinds when it walks the scan roots itself, keeps the
#        per-file behaviour and JSON shape when files are given, and gains --ratchet and --allow-raise (--ratchet with
#        files exits 2); the conformance suite records arch-check.whole-tree, arch-check.ratchet (tree shows
#        ARCH_BASELINE.json) and arch-check.ratchet-needs-whole-tree on fresh-init; the existing arch-check golden is
#        unchanged.
# DoD 4 (law): TARGET_ARCHITECTURE.yaml schema 0.4.0, file_ceiling_lines 800, six budget rules (tests excluded),
#        seven owner rules (GantryUserError, isPathUnderRoot, canonicalJson, extractImportSites, classifySpecifier,
#        validateManifestShape, the glob matchers with their four homes), four registry rules (error codes with env
#        names for the GXT_ overlap, env, commands, MCP tools), one dependency rule, one duplicate rule listing the
#        fourteen script copies; gantry arch check (whole tree) passes on this repository after
#        gantry arch check --ratchet --allow-raise wrote ARCH_BASELINE.json.
# DoD 5 (gate): scripts/dev-validate-core.sh runs gantry arch check before the conformance suite;
#        .gitagent/foreman/MANIFEST.json gantry skill gate_commands adds gantry arch check (gantry check OK);
#        scripts/arch-baseline.mjs and .gxt-quality-baseline.json are deleted; scripts/check-changed-code.sh drops the
