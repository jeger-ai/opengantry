# OpenGantry mission scaffold (Planner: fill gate, TMVC narrowing, trace rows).
# Legislated intent: gantry cage suggest: standalone, developer-initiated setup subcommand that statically scans the repo for sensitive anchors (migration dirs, IaC, container and package-registry config, CODEOWNERS, other CI systems, key and cert files) and proposes additive .cage.yaml protect entries with a reason each, printed to stdout or written to .cage.yaml.suggested; never writes .cage.yaml, never loaded by cage, refuses to run inside a cage session, no MCP tool; gantry cage -- suggest still runs an external command; cage warns when .cage.yaml has uncommitted changes
msn_id: MSN-0240
skill_key: gantry
gate_command: ./scripts/dev-validate-core.sh
# DoD 1: gantry cage suggest is a subcommand of gantry cage only (not the standalone opengantry-cage bin); gantry cage --
#        suggest still runs an external command named suggest (tests).
# DoD 2: static heuristics only (migration dirs, Terraform/k8s/Helm, Dockerfile, .npmrc/.pypirc, CODEOWNERS, Jenkins/
#        Buildkite/Bitbucket CI, key and cert files); each suggestion is {path|glob, mode, reason}; output is deterministic
#        and sorted, omits entries already covered by built-ins or the existing .cage.yaml, and parses with the MSN-0239
#        .cage.yaml loader (tests).
# DoD 3: proposal only: stdout by default; --write creates .cage.yaml.suggested and refuses to overwrite it without
#        --force; never writes .cage.yaml; cage never loads .cage.yaml.suggested (tests).
# DoD 4: cage exports GANTRY_CAGE_SESSION=1 to the wrapped process; gantry cage suggest exits 2 when it is set (tests).
# DoD 5: no gxt_* MCP tool exposes suggest (test asserts the registered tool list) (tests).
# DoD 6: cage warns on stderr, without aborting, when .cage.yaml is untracked or differs from HEAD; the JSON report
#        carries config.committed: false (tests).
# DoD 7: ./scripts/dev-validate-core.sh passes (dev-validate-core OK).
