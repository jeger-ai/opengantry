# OpenGantry mission scaffold (Planner: fill gate, TMVC narrowing, trace rows).
# Legislated intent: Add zero-config gantry cage command: snapshot built-in protected paths plus manifest forbidden_zones, run the wrapped command, diff, revert violating changes, print a receipt; reuses runtime exec forbidden-scan baseline
msn_id: MSN-0233
skill_key: gantry
gate_command: npm run validate
# DoD 1: cage reverts added/modified/deleted files in CI config, .env and .git/hooks (tests).
# DoD 2: lockfile changes are reported but kept (report-only) (tests).
# DoD 3: files over the in-memory size cap are reported detect-only, not reverted (tests).
# DoD 4: --json cage report carries path, change kind, sha256 before/after and revert
#        outcome only; no file bodies appear in output (tests; ADR-0034).
# DoD 5: cage works with no MANIFEST.json and no gantry init; manifest forbidden_zones
#        are unioned in when present; exit 3 on violation, else the wrapped exit code (tests).
# DoD 6: npm run validate passes.
