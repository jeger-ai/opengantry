interrogation:
  - finding_id: 0aab8fc3443c
    kind: undefined_boundary
    question: Paths are not mapped to any TARGET_ARCHITECTURE layer (tier Tier-2).
      Confirm boundary for all listed paths.
    hypothesis: Operator authorizes work within declared TMVC and documents boundary
      decision on the record.
    operator_answer: src/cli/ + package.json — Also allow package.json edits (e.g. a
      bin alias for cage).
  - finding_id: 95083290c452
    kind: adr_conflict
    question: Intent may relate to ADR-0034. Accept ADR decision, reject
      applicability, or cite superseding rationale?
    hypothesis: Operator explicitly accepts or rejects ADR ADR-0034 before
      legislation proceeds.
    operator_answer: "Accept; digest-only report — ADR-0034 stays ACTIVE and binds
      cage: the cage report (stdout / --json) lists path, change kind, sha256
      before/after and revert outcome only — never file bodies. It is not a
      schema-0.2.0 attestation receipt and is not written to
      .gitagent/history/receipts/."
    adr_refs:
      - ADR-0034
  - finding_id: a7bb97b7d55a
    kind: adr_conflict
    question: Intent may relate to ADR-0022. Accept ADR decision, reject
      applicability, or cite superseding rationale?
    hypothesis: Operator explicitly accepts or rejects ADR ADR-0022 before
      legislation proceeds.
    operator_answer: Accept; not applicable — ADR-0022 stays ACTIVE. cage is a CLI
      pre/post diff wrapper like runtime exec (which ADR-0022 calls
      complementary); it adds no MCP tool and no global write proxy.
    adr_refs:
      - ADR-0022
  - finding_id: c75db18757f4
    kind: adr_conflict
    question: Intent may relate to ADR-0036. Accept ADR decision, reject
      applicability, or cite superseding rationale?
    hypothesis: Operator explicitly accepts or rejects ADR ADR-0036 before
      legislation proceeds.
    operator_answer: Accept; not applicable — ADR-0036 stays ACTIVE. cage emits an
      unsigned, digest-only 'cage report' — no receipt schema, no signing, no
      --export envelope, no org/pepper fields. Naming uses 'cage report', not
      'receipt'.
    adr_refs:
      - ADR-0036
