  - finding_id: 4367eadf9a61
    kind: adr_conflict
    question: Intent may relate to ADR-0048. Accept ADR decision, reject
      applicability, or cite superseding rationale?
    hypothesis: Operator explicitly accepts or rejects ADR ADR-0048 before
      legislation proceeds.
    operator_answer: "Accept; ADR-0048 stays ACTIVE and unchanged. Resolving the
      cage root to its real path changes no rule, mode, cap or exit code: it
      only makes every protected target share one base so built-in git control
      paths keep their rule when the root is reached through a symlink, which
