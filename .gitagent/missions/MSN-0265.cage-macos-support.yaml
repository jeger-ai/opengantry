# OpenGantry mission scaffold (Planner: fill gate, TMVC narrowing, trace rows).
# Legislated by Planner stamp [MSN-0265]. Executor must not run until the [MSN-0265] legislation commit + pin.
#
# Legislated intent: macOS cage support. The target audience runs gantry-cage on macOS, but cage has only run on
# Ubuntu CI. PR #194's macOS run (on code before MSN-0252..0258) passed every halt, signal and process-tree test and
# failed one: cage suggest proposed the active core.hooksPath although it is already git control. Cause, reproduced
# on Linux: macOS temp dirs are reached through the /var -> /private/var symlink; cage builds git control targets
# from git's resolved paths and every other target from the root it was given, so with an unresolved root the git
# targets fall outside plan.root and lose their rule. The CLI's own root (git toplevel or process.cwd()) is already
# resolved, so this hits library callers and the tests, not today's gantry-cage runs.
#
# Constraint (ADR-0048 decision 7): no `detached: true` spawn and no process-group kill (`process.kill(-pid)`);
# termination stays the ps-enumerated descendant tree. Windows stays out of scope (deferred, documented only).
# Making the new job a required status check on main is a repository setting for the Planner after merge.
#
# DoD 1 (root): the cage resolves its root to the real path once (plan building and resolveCageRoot), so every
#        protected target and every git control path (.git/config, .git/hooks, active core.hooksPath) shares one
#        base and keeps its rule when the root is given through a symlink. No rule, mode, cap or exit code changes.
# DoD 2 (test): new src/cli/tests/cage-symlink-root.test.ts drives cage through a symlinked directory on any POSIX
#        host: every plan target lies under plan.root; cage suggest does not propose the active hooks path; a caged
#        command that rewrites .git/hooks/pre-commit and .env through the symlinked root has both restored. The test
#        fails against the pre-fix build (shown in the trace).
# DoD 3 (CI): repo-only .github/workflows/cage-macos.yml (not in templates/, not shipped to adopters) defines a job
#        named `cage (macos-latest)` on runs-on macos-latest, triggered by every pull_request to main and push to
#        main, without path filters: Node 24, npm ci, npm run build, every cage suite (cage, cage-watch, cage-suggest,
#        cage-symlink-root) and npm run test:cage (slim package). The trace checks this by parsing the workflow.
#        Re-legislated: the job's pass on this mission's PR is a merge-time PR check judged by the Planner, not a
#        trace row, because the pre-push hook refuses a PENDING row and the job cannot run before the push. Any
#        macOS failure it exposes is fixed within the contract, never skipped by platform; otherwise stop and
#        re-legislate.
# DoD 4 (docs): FEATURES cage section and packages/opengantry-cage/README.md state platform support: Linux and
#        macOS tested in CI, Windows not supported yet (no descendant enumeration or journal process check on
#        win32; the push guard needs sh hooks). DEVELOPMENT names the macOS job and that it should be a required
#        check. CHANGELOG gains an Unreleased entry.
# DoD 5 (gate): ./scripts/dev-validate-core.sh passes (dev-validate-core OK).
