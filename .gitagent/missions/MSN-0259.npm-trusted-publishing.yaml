# OpenGantry mission (Planner-stamped by [MSN-0259]). npm trusted publishing for both packages. No CLI change.
#
# Legislated intent: Publish both npm packages through npm trusted publishing (GitHub Actions OIDC) instead
# of the NPM_TOKEN secret: npm-publish.yml drops the token so a missing trusted publisher fails loudly
# instead of falling back, asserts npm >= 11.5.1, keeps provenance; publishConfig.provenance is removed so an
# emergency local publish works without flags; DEVELOPMENT Releasing documents the npmjs.com setup.
#
# Why: the v3.8.2 release showed the stored-token path breaking twice (E404 for a new package name, then
# EOTP because the token no longer bypasses 2FA), and npm is restricting 2FA-bypass tokens. npm 11 already
# attempts OIDC on every GitHub Actions publish (lib/utils/oidc.js) and falls back to the configured token
# when the exchange fails, which is what hid the missing trusted-publisher setup.
#
# DoD 1 (workflow): npm-publish.yml publish steps carry no NODE_AUTH_TOKEN and no secrets.* reference
#        remains in the file; permissions keep id-token: write and contents: read; a step before the
#        publishes fails unless `npm --version` is >= 11.5.1; tag pushes, the guarded workflow_dispatch and
#        both publishes through scripts/npm-publish-if-new.sh are unchanged.
# DoD 2 (script): scripts/npm-publish-if-new.sh keeps skip / publish / fail-closed behaviour and, when a
#        publish fails inside GitHub Actions, prints a hint naming the package and the trusted-publisher
#        settings it needs (repository jeger-ai/opengantry, workflow npm-publish.yml).
# DoD 3 (provenance): publishConfig in package.json and packages/opengantry-cage/package.json keeps
#        access public and drops provenance; CI still passes --provenance through the script, and a local
#        `npm publish [--workspace <name>] --access public` no longer fails with EUSAGE.
# DoD 4 (tests + docs): src/cli/tests/npm-publish-if-new.test.ts asserts DoD 1 and the DoD 2 hint (stub
#        npm, GITHUB_ACTIONS set); docs/DEVELOPMENT.md Releasing replaces the NPM_TOKEN guidance with the
#        trusted-publisher setup on npmjs.com for both packages, the emergency local publish, and the
#        follow-ups (disallow tokens on both packages, delete the NPM_TOKEN secret).
# DoD 5 (gate): `./scripts/dev-validate-core.sh` passes (dev-validate-core OK); `npm run test:cage` passes.
#
# Planner, outside this mission: configure a trusted publisher on npmjs.com for @jeger-ai/opengantry and
# @jeger-ai/opengantry-cage (GitHub Actions, jeger-ai/opengantry, npm-publish.yml) before the next release;
# afterwards disallow tokens on both packages and delete the NPM_TOKEN secret. The first real proof is the
# next release run (a dispatch for 3.8.2 skips both packages and cannot exercise the publish).
msn_id: MSN-0259
skill_key: substrate
gate_command: ./scripts/dev-validate-core.sh
