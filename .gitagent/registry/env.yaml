# Registry (ADR-0052 step 1, MSN-0280). Humans write it: YAML 1.2 core, no aliases, no unknown keys.
schema: opengantry.registry.v1
kind: env
law: "ADR-0052 B3: adding an entry is a Planner edit in a substrate mission; the step-3 evaluator fails a build that uses a name not listed here."
note: Environment variables the CLI reads (role read), exports into agent sessions (role session, see docs/reference/session-variables.md) or sets for child processes (role emit). GXT_ is also the error-code prefix; ADR-0052 A9 ends that overlap.
prefixes:
  - GANTRY_
  - GXT_
  - GAPMAN_
