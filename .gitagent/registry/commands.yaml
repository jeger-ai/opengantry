# Registry (ADR-0052 step 1, MSN-0281). Humans write it: YAML 1.2 core, no aliases, no unknown keys.
schema: opengantry.registry.v1
kind: commands
law: "ADR-0052 B3: adding an entry is a Planner edit in a substrate mission; the step-3 evaluator fails a build that uses a name not listed here."
note: Every gantry subcommand, public and hidden. since names the first commit that registered the leaf name in src/cli (registrar basis; for a leaf name used by several groups it is the earliest).
