schema_version: "0.4.0"
domain: code
# ADR-0052 B7: no counted file may exceed this many lines; the layer budgets below ratchet against ARCH_BASELINE.json.
file_ceiling_lines: 800
scan_roots:
  - src/cli/**
  - packages/core/**
  - packages/git/**
  - packages/cage/**
  - packages/plane/**
  - packages/verify/**
  - packages/missions/**
# Files under the scan roots that no rule judges and no budget counts (ADR-0052 B4: tests are not counted).
exclude:
  - "**/tests/**"
languages:
  - typescript
layers:
  - id: core
    globs:
      - packages/core/src/**
  - id: git
    globs:
      - packages/git/src/**
  - id: cage
    globs:
      - packages/cage/src/**
  - id: plane
    globs:
      - packages/plane/src/**
  - id: verify
    globs:
      - packages/verify/src/**
  - id: missions
    globs:
      - packages/missions/src/**
  - id: command
    globs:
      - src/cli/commands/**
  # ADR-0054 decision 7: the CLI's support modules, grouped by role (src/cli/lib/ is gone; the layer keeps its id).
  - id: lib
    globs:
      - src/cli/output/**
      - src/cli/mcp/**
      - src/cli/doctor/**
      - src/cli/report/**
      - src/cli/init/**
      - src/cli/flows/**
  - id: delivery
    globs:
      - src/cli/index.ts
      - src/cli/program.ts
      - src/cli/program-*.ts
      - src/cli/cage-bin.ts
      - src/cli/kernel.ts
rules:
  - id: RULE-CORE-NO-FS
    from_layer: core
    forbid_specifier_substring: "node:fs"
  - id: RULE-CORE-NO-CHILD-PROCESS
    from_layer: core
    forbid_specifier_substring: "node:child_process"
  - id: RULE-CORE-NO-OS
    from_layer: core
    forbid_specifier_substring: "node:os"
  - id: RULE-CORE-NO-NET
    from_layer: core
    forbid_specifier_substring: "node:net"
  - id: RULE-CORE-NO-HTTP
    from_layer: core
    forbid_specifier_substring: "node:http"
  - id: RULE-CORE-NO-GIT-LAYER
    from_layer: core
    forbid_import_layer: git
  - id: RULE-CORE-NO-LIB-LAYER
    from_layer: core
    forbid_import_layer: lib
  - id: RULE-CORE-NO-COMMAND-LAYER
    from_layer: core
    forbid_import_layer: command
  - id: RULE-GIT-NO-LIB-LAYER
    from_layer: git
    forbid_import_layer: lib
  - id: RULE-GIT-NO-COMMAND-LAYER
    from_layer: git
    forbid_import_layer: command
  - id: RULE-CAGE-NO-LIB-LAYER
    from_layer: cage
    forbid_import_layer: lib
  - id: RULE-CAGE-NO-COMMAND-LAYER
    from_layer: cage
    forbid_import_layer: command
  - id: RULE-CAGE-NO-DELIVERY-LAYER
    from_layer: cage
    forbid_import_layer: delivery
  - id: RULE-PLANE-NO-CAGE-LAYER
    from_layer: plane
    forbid_import_layer: cage
  - id: RULE-PLANE-NO-LIB-LAYER
    from_layer: plane
    forbid_import_layer: lib
  - id: RULE-PLANE-NO-COMMAND-LAYER
    from_layer: plane
    forbid_import_layer: command
  - id: RULE-PLANE-NO-DELIVERY-LAYER
    from_layer: plane
    forbid_import_layer: delivery
  # ADR-0054 decision 5: verify (the ADR-0051 contract engine) depends on core and git only.
  - id: RULE-VERIFY-NO-CAGE-LAYER
    from_layer: verify
    forbid_import_layer: cage
  - id: RULE-VERIFY-NO-PLANE-LAYER
    from_layer: verify
    forbid_import_layer: plane
  - id: RULE-VERIFY-NO-LIB-LAYER
    from_layer: verify
    forbid_import_layer: lib
  - id: RULE-VERIFY-NO-COMMAND-LAYER
    from_layer: verify
    forbid_import_layer: command
  - id: RULE-VERIFY-NO-DELIVERY-LAYER
    from_layer: verify
    forbid_import_layer: delivery
  # ADR-0054 decisions 2 and 6: missions depends on core, git, verify and plane.
  - id: RULE-MISSIONS-NO-CAGE-LAYER
    from_layer: missions
    forbid_import_layer: cage
  - id: RULE-MISSIONS-NO-LIB-LAYER
    from_layer: missions
    forbid_import_layer: lib
  - id: RULE-MISSIONS-NO-COMMAND-LAYER
    from_layer: missions
    forbid_import_layer: command
  - id: RULE-MISSIONS-NO-DELIVERY-LAYER
    from_layer: missions
    forbid_import_layer: delivery
  - id: RULE-PLANE-NO-MISSIONS-LAYER
    from_layer: plane
    forbid_import_layer: missions
  - id: RULE-VERIFY-NO-MISSIONS-LAYER
    from_layer: verify
    forbid_import_layer: missions
  - id: RULE-LIB-TO-COMMAND
    from_layer: lib
    forbid_import_layer: command
  - id: RULE-LIB-COMMANDER
    from_layer: lib
    forbid_specifier_substring: commander
  - id: RULE-COMMAND-RUNTIME-EXEC-PROCESS
    from_layer: command
    forbid_resolved_path_substring: runtime-exec-process
  - id: RULE-COMMAND-NO-EXITCODE-LADDER
    from_layer: command
    applies_to:
      - src/cli/commands/pin.ts
      - src/cli/commands/scan.ts
    forbid_pattern: "setExitCode\\(e instanceof GantryUserError"
  - id: RULE-COMMAND-NO-JSON-STRINGIFY
    from_layer: command
    applies_to:
      - src/cli/commands/pin.ts
      - src/cli/commands/scan.ts
    forbid_pattern: "JSON\\.stringify\\("
  - id: RULE-COMMAND-NO-PROCESS-EXIT
    from_layer: command
    applies_to:
      - src/cli/commands/pin.ts
      - src/cli/commands/scan.ts
    forbid_pattern: "process\\.exit\\("
  # ADR-0064: Effect brings no network path. Banned in every file, by `from`, side-effect `import`, `import(...)` and
  # `require(...)`, in any quotes (a backtick too): ws, undici, @effect/platform-node, the @effect/platform-node-shared barrel and every subpath of it
  # outside the allowlist, and every effect subpath outside its allowlist (the root, one-segment root modules such as
  # effect/Schema, and effect/{schema,cli,process,encoding,testing}). The existing network paths (ADR-0055 and the policy
  # and deps fetches) use none of them. Pattern rules apply to the scan roots unless they set applies_to.
  - id: RULE-NET-EFFECT
    from_layer: "*"
    forbid_pattern: '\b(?:from|import|require)\s*\(?\s*["''`](?:(?:ws|undici|@effect/platform-node)(?:/[^"''`]*)?|effect/(?!(?:[A-Z]\w*|schema|cli|process|encoding|testing)["''`]|(?:schema|cli|process|encoding|testing)/)[^"''`]*|@effect/platform-node-shared(?:/(?!(?:NodeFileSystem|NodePath|NodeChildProcessSpawner|NodeRuntime|NodeStdio|NodeTerminal)["''`])[^"''`]*)?)["''`]'
  # ADR-0064 (amends ADR-0054): core may import effect, but not its I/O modules (FileSystem, Path, process, socket, cli).
  # Effect's network modules are banned in core by RULE-NET-EFFECT already.
  - id: RULE-CORE-EFFECT-PURE
    from_layer: core
    applies_to:
      - packages/core/src/**
    forbid_pattern: '\b(?:from|import|require)\s*\(?\s*["''`]effect/(?:process|socket|cli|FileSystem|Path)(?:/[^"''`]*)?["''`]|\b(?:import|export)\s+(?:type\s+)?\{[^}]*\b(?:FileSystem|Path|ChildProcess|ChildProcessSpawner)\b[^}]*\}\s*from\s*["''`]effect["''`]'

  # --- Structural law (ADR-0052 B2 to B7; schema 0.4.0). gantry arch check without file arguments judges the whole tree.
  # B4: each layer's files, lines and export statements may not exceed its row in ARCH_BASELINE.json. Lowering is free;
  # `gantry arch check --ratchet` records it in a Planner or release mission. Growth needs `--ratchet --allow-raise`
  # in a legislated mission. Tests are not counted (`exclude` above).
  - id: BUDGET-CORE
    kind: budget
    layer: core
  - id: BUDGET-GIT
    kind: budget
    layer: git
  - id: BUDGET-CAGE
    kind: budget
    layer: cage
  - id: BUDGET-PLANE
    kind: budget
    layer: plane
  - id: BUDGET-VERIFY
    kind: budget
    layer: verify
  - id: BUDGET-MISSIONS
    kind: budget
    layer: missions
  - id: BUDGET-COMMAND
    kind: budget
    layer: command
  - id: BUDGET-LIB
    kind: budget
    layer: lib
  - id: BUDGET-DELIVERY
    kind: budget
    layer: delivery
  # B2 owner: one concept, one home. A rule without applies_to judges every file under the scan roots that exclude keeps.
  - id: OWNER-USER-ERROR
    kind: owner
    pattern: "class GantryUserError\\b"
    owners: [packages/core/src/user-error.ts]
  - id: OWNER-PATH-UNDER-ROOT
    kind: owner
    pattern: "function isPathUnderRoot\\("
    owners: [packages/core/src/law.ts]
  - id: OWNER-CANONICAL-JSON
    kind: owner
    pattern: "function canonicalJson\\("
    owners: [packages/core/src/canonical-json.ts]
  - id: OWNER-IMPORT-SCANNER
    kind: owner
    pattern: "function extractImportSites\\("
    owners: [packages/core/src/import-scanner.ts]
  - id: OWNER-SPECIFIER
    kind: owner
    pattern: "function classifySpecifier\\("
    owners: [packages/core/src/specifier.ts]
  - id: OWNER-MANIFEST-SHAPE
    kind: owner
    pattern: "function validateManifestShape\\("
    owners: [packages/core/src/manifest.ts]
  - id: OWNER-GLOB-MATCHERS
    kind: owner
    pattern: "function (pathMatchesGlob\\w*|\\w*[Gg]lobToRegExp|scopeRegExp|verifyPathMatcher|matchGlob|\\w*[Cc]oversPath)\\("
    owners:
      - packages/core/src/path-glob.ts
  # ADR-0064: the live platform layers have one home; RULE-NET-EFFECT still judges which subpaths it may import.
  - id: OWNER-EFFECT-PLATFORM
    kind: owner
    pattern: '\b(?:from|import|require)\s*\(?\s*["''`]@effect/platform-node-shared[/"''`]'
    owners: [packages/git/src/platform.ts]
  # ADR-0064 (spec v5.3 G7): Effect's test kit belongs to tests and to the *Test layers in packages/*/src/testing/.
  - id: OWNER-EFFECT-TESTING
    kind: owner
    pattern: '\b(?:from|import|require)\s*\(?\s*["''`]effect/testing[/"''`]'
    owners: ["packages/*/src/testing/**"]
  # ADR-0064 (spec v5.3 G7): global fetch and WebSocket need no import, so the import rules cannot see them. Only the
  # named network files may use them (the GitHub host broker and the architecture fetch, ADR-0055 upheld).
  - id: OWNER-NET-GLOBALS
    kind: owner
    pattern: '\b(?:globalThis|global|self|window)\s*(?:\?\.|\.)\s*fetch\b|\b(?:globalThis|global|self|window)\s*(?:\?\.)?\s*\[\s*["''`]fetch|(?<![\w$.])fetch\s*(?:\?\.\s*)?\(|\bWebSocket\b'
    owners: [packages/missions/src/admission/github-client.ts, packages/missions/src/arch/external/architecture-fetch.ts]
  # B3 registry: a name the code uses must be registered; adding one is a Planner edit under .gitagent/registry/.
  - id: REGISTRY-ERROR-CODES
    kind: registry
    patterns: ['"(GXT_[A-Z0-9_]*[A-Z0-9])"']
    registries: [.gitagent/registry/error-codes.yaml]
  - id: REGISTRY-ENV
    kind: registry
    patterns: ['"(GANTRY_[A-Z0-9_]*[A-Z0-9])"', 'process\\.env\\.(GANTRY_[A-Z0-9_]+)']
    registries: [.gitagent/registry/env.yaml]
  - id: REGISTRY-COMMANDS
    kind: registry
    patterns: ['\\.command\\("([a-z][a-z-]*)"']
    registries: [.gitagent/registry/commands.yaml]
    applies_to: ["src/cli/program*.ts", "src/cli/commands/**", "src/cli/cage-bin.ts"]
  - id: REGISTRY-MCP-TOOLS
    kind: registry
    patterns: ['"(gxt_[a-z_]+)"']
    registries: [.gitagent/registry/mcp-tools.yaml]
    applies_to: ["src/cli/mcp/**"]
  # B2 dependency: every package.json dependency, runtime or dev, is in the dependency registry.
  - id: DEPENDENCIES
    kind: dependency
    registry: .gitagent/registry/dependencies.yaml
    manifest: package.json
  # B2 cycles: no runtime import cycle among the counted files (static imports and re-exports; `import type` is no edge).
  - id: CYCLES
    kind: cycles
  # B2 duplicate: scripts/ and templates/scripts/ are kept byte-identical by assert-dogfood-sync.sh; ADR-0052 A8 shrinks
  # the list as scripts move into the CLI (step 5b removed six); the pairs that exist today are allowed, a new one is not.
  - id: DUPLICATE-SCRIPTS-TEMPLATES
    kind: duplicate
    between: [scripts/, templates/scripts/]
    allowed:
      - scripts/dev-validate.sh
      - scripts/gxt-runtime-env.sh
      - scripts/gxt-shell-agent.sh
      - scripts/mcp-launcher.sh
      - scripts/validate-mcp-dogfood.mjs
