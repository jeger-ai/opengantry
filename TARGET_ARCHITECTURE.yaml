schema_version: "0.4.0"
domain: code
# ADR-0052 B7: no counted file may exceed this many lines; the layer budgets below ratchet against ARCH_BASELINE.json.
file_ceiling_lines: 800
scan_roots:
  - src/cli/**
  - packages/core/**
  - packages/git/**
  - packages/cage/**
  - packages/plane/**
  - packages/verify/**
languages:
  - typescript
layers:
  - id: core
    globs:
      - packages/core/src/**
  - id: git
    globs:
      - packages/git/src/**
  - id: cage
    globs:
      - packages/cage/src/**
  - id: plane
    globs:
      - packages/plane/src/**
  - id: verify
    globs:
      - packages/verify/src/**
  - id: command
    globs:
      - src/cli/commands/**
  - id: lib
    globs:
      - src/cli/lib/**
  - id: delivery
    globs:
      - src/cli/index.ts
      - src/cli/program.ts
      - src/cli/program-*.ts
      - src/cli/cage-bin.ts
      - src/cli/kernel.ts
rules:
  - id: RULE-CORE-NO-FS
    from_layer: core
    forbid_specifier_substring: "node:fs"
  - id: RULE-CORE-NO-CHILD-PROCESS
    from_layer: core
    forbid_specifier_substring: "node:child_process"
  - id: RULE-CORE-NO-OS
    from_layer: core
    forbid_specifier_substring: "node:os"
  - id: RULE-CORE-NO-NET
    from_layer: core
    forbid_specifier_substring: "node:net"
  - id: RULE-CORE-NO-HTTP
    from_layer: core
    forbid_specifier_substring: "node:http"
  - id: RULE-CORE-NO-GIT-LAYER
    from_layer: core
    forbid_import_layer: git
  - id: RULE-CORE-NO-LIB-LAYER
    from_layer: core
    forbid_import_layer: lib
  - id: RULE-CORE-NO-COMMAND-LAYER
    from_layer: core
    forbid_import_layer: command
  - id: RULE-GIT-NO-LIB-LAYER
    from_layer: git
    forbid_import_layer: lib
  - id: RULE-GIT-NO-COMMAND-LAYER
    from_layer: git
    forbid_import_layer: command
  - id: RULE-CAGE-NO-LIB-LAYER
    from_layer: cage
    forbid_import_layer: lib
  - id: RULE-CAGE-NO-COMMAND-LAYER
    from_layer: cage
    forbid_import_layer: command
  - id: RULE-CAGE-NO-DELIVERY-LAYER
    from_layer: cage
    forbid_import_layer: delivery
  - id: RULE-PLANE-NO-CAGE-LAYER
    from_layer: plane
    forbid_import_layer: cage
  - id: RULE-PLANE-NO-LIB-LAYER
    from_layer: plane
    forbid_import_layer: lib
  - id: RULE-PLANE-NO-COMMAND-LAYER
    from_layer: plane
    forbid_import_layer: command
  - id: RULE-PLANE-NO-DELIVERY-LAYER
    from_layer: plane
    forbid_import_layer: delivery
  # ADR-0054 decision 5: verify (the ADR-0051 contract engine) depends on core and git only.
  - id: RULE-VERIFY-NO-CAGE-LAYER
    from_layer: verify
    forbid_import_layer: cage
  - id: RULE-VERIFY-NO-PLANE-LAYER
    from_layer: verify
    forbid_import_layer: plane
  - id: RULE-VERIFY-NO-LIB-LAYER
    from_layer: verify
    forbid_import_layer: lib
  - id: RULE-VERIFY-NO-COMMAND-LAYER
    from_layer: verify
    forbid_import_layer: command
  - id: RULE-VERIFY-NO-DELIVERY-LAYER
    from_layer: verify
    forbid_import_layer: delivery
  - id: RULE-LIB-TO-COMMAND
    from_layer: lib
    forbid_import_layer: command
  - id: RULE-LIB-COMMANDER
    from_layer: lib
    forbid_specifier_substring: commander
  - id: RULE-COMMAND-RUNTIME-EXEC-PROCESS
    from_layer: command
    forbid_resolved_path_substring: runtime-exec-process
  - id: RULE-COMMAND-NO-EXITCODE-LADDER
    from_layer: command
    applies_to:
      - src/cli/commands/pin.ts
      - src/cli/commands/scan.ts
      - src/cli/commands/receipt.ts
      - src/cli/commands/attest.ts
    forbid_pattern: "setExitCode\\(e instanceof GantryUserError"
  - id: RULE-COMMAND-NO-JSON-STRINGIFY
    from_layer: command
    applies_to:
      - src/cli/commands/pin.ts
      - src/cli/commands/scan.ts
      - src/cli/commands/receipt.ts
      - src/cli/commands/attest.ts
    forbid_pattern: "JSON\\.stringify\\("
  - id: RULE-COMMAND-NO-PROCESS-EXIT
    from_layer: command
    applies_to:
      - src/cli/commands/pin.ts
      - src/cli/commands/scan.ts
      - src/cli/commands/receipt.ts
      - src/cli/commands/attest.ts
    forbid_pattern: "process\\.exit\\("

  # --- Structural law (ADR-0052 B2 to B7; schema 0.4.0). gantry arch check without file arguments judges the whole tree.
  # B4: each layer's files, lines and export statements may not exceed its row in ARCH_BASELINE.json. Lowering is free;
  # `gantry arch check --ratchet` records it in a Planner or release mission. Growth needs `--ratchet --allow-raise`
  # in a legislated mission. Tests are not counted.
  - id: BUDGET-CORE
    kind: budget
    layer: core
    exclude: ["**/tests/**"]
  - id: BUDGET-GIT
    kind: budget
    layer: git
    exclude: ["**/tests/**"]
  - id: BUDGET-CAGE
    kind: budget
    layer: cage
    exclude: ["**/tests/**"]
  - id: BUDGET-PLANE
    kind: budget
    layer: plane
    exclude: ["**/tests/**"]
  - id: BUDGET-VERIFY
    kind: budget
    layer: verify
    exclude: ["**/tests/**"]
  - id: BUDGET-COMMAND
    kind: budget
    layer: command
    exclude: ["**/tests/**"]
  - id: BUDGET-LIB
    kind: budget
    layer: lib
    exclude: ["**/tests/**"]
  - id: BUDGET-DELIVERY
    kind: budget
    layer: delivery
    exclude: ["**/tests/**"]
  # B2 owner: one concept, one home. The glob-matcher rule lists every matcher that exists today; a fifth is refused.
  - id: OWNER-USER-ERROR
    kind: owner
    pattern: "class GantryUserError\\b"
    owners: [packages/core/src/user-error.ts]
    applies_to: ["src/cli/lib/**", "src/cli/commands/**", "src/cli/program*.ts", "src/cli/index.ts", "src/cli/cage-bin.ts", "src/cli/kernel.ts", "packages/*/src/**"]
  - id: OWNER-PATH-UNDER-ROOT
    kind: owner
    pattern: "function isPathUnderRoot\\("
    owners: [packages/core/src/law.ts]
    applies_to: ["src/cli/lib/**", "src/cli/commands/**", "src/cli/program*.ts", "src/cli/index.ts", "src/cli/cage-bin.ts", "src/cli/kernel.ts", "packages/*/src/**"]
  - id: OWNER-CANONICAL-JSON
    kind: owner
    pattern: "function canonicalJson\\("
    owners: [packages/core/src/canonical-json.ts]
    applies_to: ["src/cli/lib/**", "src/cli/commands/**", "src/cli/program*.ts", "src/cli/index.ts", "src/cli/cage-bin.ts", "src/cli/kernel.ts", "packages/*/src/**"]
  - id: OWNER-IMPORT-SCANNER
    kind: owner
    pattern: "function extractImportSites\\("
    owners: [packages/core/src/import-scanner.ts]
    applies_to: ["src/cli/lib/**", "src/cli/commands/**", "src/cli/program*.ts", "src/cli/index.ts", "src/cli/cage-bin.ts", "src/cli/kernel.ts", "packages/*/src/**"]
  - id: OWNER-SPECIFIER
    kind: owner
    pattern: "function classifySpecifier\\("
    owners: [packages/core/src/specifier.ts]
    applies_to: ["src/cli/lib/**", "src/cli/commands/**", "src/cli/program*.ts", "src/cli/index.ts", "src/cli/cage-bin.ts", "src/cli/kernel.ts", "packages/*/src/**"]
  - id: OWNER-MANIFEST-SHAPE
    kind: owner
    pattern: "function validateManifestShape\\("
    owners: [packages/core/src/manifest.ts]
    applies_to: ["src/cli/lib/**", "src/cli/commands/**", "src/cli/program*.ts", "src/cli/index.ts", "src/cli/cage-bin.ts", "src/cli/kernel.ts", "packages/*/src/**"]
  - id: OWNER-GLOB-MATCHERS
    kind: owner
    pattern: "function (pathMatchesGlob\\w*|\\w*[Gg]lobToRegExp|scopeRegExp|verifyPathMatcher|matchGlob|\\w*[Cc]oversPath)\\("
    owners:
      - packages/core/src/path-glob.ts
    applies_to: ["src/cli/lib/**", "src/cli/commands/**", "src/cli/program*.ts", "src/cli/index.ts", "src/cli/cage-bin.ts", "src/cli/kernel.ts", "packages/*/src/**"]
  # B3 registry: a name the code uses must be registered; adding one is a Planner edit under .gitagent/registry/.
  - id: REGISTRY-ERROR-CODES
    kind: registry
    patterns: ['"(GXT_[A-Z0-9_]*[A-Z0-9])"']
    registries: [.gitagent/registry/error-codes.yaml]
    applies_to: ["src/cli/lib/**", "src/cli/commands/**", "src/cli/program*.ts", "src/cli/index.ts", "src/cli/cage-bin.ts", "src/cli/kernel.ts", "packages/*/src/**"]
  - id: REGISTRY-ENV
    kind: registry
    patterns: ['"(GANTRY_[A-Z0-9_]*[A-Z0-9])"', 'process\\.env\\.(GANTRY_[A-Z0-9_]+)']
    registries: [.gitagent/registry/env.yaml]
    applies_to: ["src/cli/lib/**", "src/cli/commands/**", "src/cli/program*.ts", "src/cli/index.ts", "src/cli/cage-bin.ts", "src/cli/kernel.ts", "packages/*/src/**"]
  - id: REGISTRY-COMMANDS
    kind: registry
    patterns: ['\\.command\\("([a-z][a-z-]*)"']
    registries: [.gitagent/registry/commands.yaml]
    applies_to: ["src/cli/program*.ts", "src/cli/commands/**", "src/cli/cage-bin.ts"]
  - id: REGISTRY-MCP-TOOLS
    kind: registry
    patterns: ['"(gxt_[a-z_]+)"']
    registries: [.gitagent/registry/mcp-tools.yaml]
    applies_to: ["src/cli/lib/mcp/**"]
  # B2 dependency: every package.json dependency, runtime or dev, is in the dependency registry.
  - id: DEPENDENCIES
    kind: dependency
    registry: .gitagent/registry/dependencies.yaml
    manifest: package.json
  # B2 duplicate: scripts/ and templates/scripts/ are kept byte-identical by assert-dogfood-sync.sh; ADR-0052 A8 shrinks
  # the list as scripts move into the CLI (step 5b removed six); the pairs that exist today are allowed, a new one is not.
  - id: DUPLICATE-SCRIPTS-TEMPLATES
    kind: duplicate
    between: [scripts/, templates/scripts/]
    allowed:
      - scripts/dev-validate.sh
      - scripts/gxt-runtime-env.sh
      - scripts/gxt-shell-agent.sh
      - scripts/mcp-launcher.sh
      - scripts/validate-mcp-dogfood.mjs
