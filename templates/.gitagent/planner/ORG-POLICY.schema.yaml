# ORG-POLICY.schema — JSON Schema for organization policy bundles (ADR-0042)
# Generated from packages/core/src/schemas by scripts/gen-schemas.mjs (ADR-0052 A6). Do not edit; the CLI validates with zod.
$schema: https://json-schema.org/draft/2020-12/schema
$id: https://opengantry.local/schemas/org-policy.v1.json
type: object
properties:
  schema_version:
    type: string
    const: 1.0.0
  org_id:
    type: string
    minLength: 1
  policy_id:
    type: string
    minLength: 1
  version:
    type: string
    minLength: 1
    description: Semver or monotonic label for the bundle (not the CLI).
  signers:
    default: []
    type: array
    items:
      type: object
      properties:
        principal:
          type: string
          minLength: 1
          description: SSH or GPG principal allowed to sign the policy commit.
        kind:
          type: string
          enum:
            - ssh
            - gpg
      required:
        - principal
      additionalProperties: false
  mandatory_gates:
    default: []
    type: array
    items:
      type: object
      properties:
        id:
          type: string
          minLength: 1
        command:
          type: string
          minLength: 1
        adapter:
          default: generic
          type: string
          enum:
            - generic
            - eslint
            - tsc
        success_substring:
          type:
            - string
            - "null"
      required:
        - id
        - command
      additionalProperties: false
  banned_imports:
    default: []
    type: array
    items:
      type: object
      properties:
        specifier:
          type: string
          minLength: 1
        scope:
          default: changed
          description: changed = gantry check-imports on the mission diff; all = whole tree.
          type: string
          enum:
            - changed
            - all
      required:
        - specifier
      additionalProperties: false
  config_floor:
    type: object
    properties:
      planner_signature:
        type: string
        enum:
          - off
          - warn
          - require
      receipt_signature:
        type: string
        enum:
          - off
          - warn
          - require
      ledger_signature:
        type: string
        enum:
          - off
          - warn
          - require
      ledger_mode:
        type: string
        enum:
          - off
          - local
      flight_telemetry:
        type: object
        properties:
          body_mode:
            type: string
            enum:
              - hash_only
              - full
        additionalProperties: false
      break_glass:
        type: object
        properties:
          require_ledger_entry:
            type: boolean
        additionalProperties: false
    additionalProperties: false
  manifest_constraints:
    type: object
    properties:
      forbidden_zones_add:
        type: array
        items:
          type: string
          minLength: 1
      path_risks_min:
        type: object
        propertyNames:
          type: string
        additionalProperties:
          type: string
          enum:
            - Tier-1
            - Tier-2
            - Tier-3
      perimeter_protected_add:
        type: array
        items:
          type: string
          minLength: 1
    additionalProperties: false
  expected_digests:
    type: object
    properties:
      schema_version:
        type: string
        const: 0.1.0
      manifest_sha256:
        type: string
        pattern: ^[0-9a-f]{64}$
      target_architecture_sha256:
        anyOf:
          - type: string
            pattern: ^[0-9a-f]{64}$
          - type: "null"
      config_sha256:
        anyOf:
          - type: string
            pattern: ^[0-9a-f]{64}$
          - type: "null"
    additionalProperties: false
required:
  - schema_version
  - org_id
  - policy_id
  - version
additionalProperties: false
description: OpenGantryOrgPolicy
