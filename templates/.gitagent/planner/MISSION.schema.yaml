# MISSION.schema — JSON Schema for structured missions
# Generated from packages/core/src/schemas by scripts/gen-schemas.mjs (ADR-0052 A6). Do not edit; the CLI validates with zod.
$schema: https://json-schema.org/draft/2020-12/schema
$id: https://opengantry.local/schemas/mission.v1_1.json
type: object
properties:
  contract:
    type: object
    properties:
      tmvc_roots:
        type: array
        items:
          type: string
          minLength: 1
      forbidden_zones:
        type: array
        items:
          type: string
          minLength: 1
      allowed_imports:
        type: array
        items:
          type: string
          minLength: 1
      banned_imports:
        type: array
        items:
          type: string
          minLength: 1
      allow_dynamic_specifiers:
        default: false
        description: When false, import(expr) / require(expr) with a non-literal argument under effective TMVC roots fails GXT_CONTRACT_IMPORT_DYNAMIC.
        type: boolean
      strict_relative_imports:
        default: false
        description: When true, relative or alias imports resolving outside effective TMVC roots fail GXT_CONTRACT_SCOPE_ESCAPE (forbidden zones always fail).
        type: boolean
    additionalProperties: false
    description: "Planner-sealed mission cage (ADR-0045). Tighten-only: tmvc_roots must be a subset of the skill's manifest roots; forbidden_zones and banned_imports are unioned with skill and org-policy sets. gantry verify re-reads this block from the Planner stamp commit and fails GXT_CONTRACT_TAMPERED on drift."
  contract_sha256:
    description: SHA-256 of the canonical (normalized, sorted) contract block.
    type: string
    pattern: ^[0-9a-f]{64}$
  msn_id:
    type: string
    pattern: ^MSN-[0-9]{4}$
  msnId:
    type: string
    pattern: ^MSN-[0-9]{4}$
  skill_key:
    type: string
    minLength: 1
  gate_command:
    type: string
    minLength: 1
  gate_success_substring:
    type:
      - string
      - "null"
  gate_adapter:
    default: generic
    description: "Explicit gate output parser (ADR-0041). generic: exit code + optional success substring only. eslint: gate_command must emit `eslint --format json`; tsc: gate_command must emit plain tsc diagnostics. Routing is never inferred from gate_command text."
    type: string
    enum:
      - generic
      - eslint
      - tsc
  virtual_capture:
    default: false
    description: Ignored since 4.0 (ADR-0052 A10 parked the virtual scratch store; see examples/virtual-scratch/). Still accepted, so v3 missions keep validating.
    type: boolean
  upgrade_payload:
    type: object
    properties:
      from_version:
        type: string
      to_version:
        type: string
      staged_root:
        type: string
        const: .gitagent/.upgrade-tmp
      planned_writes:
        type: array
        items:
          type: string
      skipped_scaffold_only:
        type: array
        items:
          type: string
      staged_hashes:
        type: object
        propertyNames:
          type: string
        additionalProperties:
          type: string
      created_at:
        type: string
    required:
      - from_version
      - to_version
      - planned_writes
      - staged_hashes
    additionalProperties: false
  trace_rows:
    default: []
    type: array
    items:
      type: object
      properties:
        dod_id:
          type: string
        trace_quote:
          type: string
        anchor:
          type: string
        status:
          type: string
          pattern: ^(PASS|FAIL|PENDING|pass|fail|pending)$
      required:
        - dod_id
        - trace_quote
        - anchor
        - status
      additionalProperties: false
  interrogation:
    default: []
    type: array
    items:
      type: object
      properties:
        finding_id:
          type: string
          minLength: 8
        kind:
          type: string
          enum:
            - risk_escalation
            - forbidden_zone
            - undefined_boundary
            - missing_test_criteria
            - adr_conflict
        question:
          type: string
          minLength: 1
        hypothesis:
          type: string
          minLength: 1
        operator_answer:
          type: string
          minLength: 1
        adr_refs:
          type: array
          items:
            type: string
            pattern: ^ADR-[0-9]{4}$
      required:
        - finding_id
        - kind
        - question
        - hypothesis
        - operator_answer
      additionalProperties: false
  interrogation_sha256:
    type: string
    pattern: ^[0-9a-f]{64}$
  declared_paths:
    type: array
    items:
      type: string
      minLength: 1
  depends_on:
    default: []
    description: Cross-repo mission dependencies (ADR-0044). Resolved offline from fetched refs/gxt/deps/<slug> ledger chains. gantry deps fetch is the only network path; verify/doctor/check read local refs only.
    type: array
    items:
      type: object
      properties:
        repo:
          type: string
          minLength: 1
          description: Canonical host/owner/repo or git URL.
        ref:
          default: refs/gxt/ledger
          type: string
        msn_id:
          type: string
          pattern: ^MSN-[0-9]{4}$
        require:
          type: object
          properties:
            verify_status:
              default: passed
              type: string
              enum:
                - passed
            signed:
              default: false
              type: boolean
            max_age_days:
              type: number
              exclusiveMinimum: 0
          additionalProperties: false
        expected_repository_hash:
          type: string
          pattern: ^[0-9a-f]{64}$
      required:
        - repo
        - msn_id
      additionalProperties: false
required:
  - skill_key
  - gate_command
additionalProperties: false
description: OpenGantryMission
