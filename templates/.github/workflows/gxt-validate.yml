# Validates OpenGantry substrate: Foreman MANIFEST + path-scoped [MSN-NNNN] on PRs.
# Shipped by gantry init / gantry upgrade (managed): every job installs the published CLI from npm.
#
# PR governance (pull_request only): mission PRs must target the repo default branch
# (override: repository variable GXT_INTEGRATION_BRANCH when integration branch differs).
# MSN policy (pull_request only): commits touching MSN-enforced paths must have
# subject [MSN-NNNN] (four digits), a valid gxt-bypass git note, or satisfy
# repository-declared trusted_automation policy (.gitagent/config.yaml, or the 3.x config.json).
# Mission verify (pull_request only): gantry ci verify-missions — full gantry verify on every
# mission file the PR changes. Gates run with only Node and gantry installed: a gate that needs
# the project's dependencies installs them itself (gantry upgrade apply replaces edits to this file).
# Paths = fixed substrate (.gitagent/, EXECUTOR_LOG.md, .githooks/, gxt-validate.yml)
#       + all MANIFEST skills[].tmvc_roots.

name: GXT validate

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  pr_governance:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Enforce base branch isolation
        run: |
          base="${{ github.event.pull_request.base.ref }}"
          expected="${{ vars.GXT_INTEGRATION_BRANCH || github.event.repository.default_branch }}"
          if [ "$base" != "$expected" ]; then
            echo "::error::Governance Violation: Mission PR targets '$base' instead of '$expected'. Stacking missions violates blast-radius isolation. Re-target the PR to '$expected'."
            exit 1
          fi

  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          # No npm cache: the job installs only the gantry CLI, and an adopter repository may have no lockfile.
          package-manager-cache: false

      - name: Install gantry
        run: npm install -g @jeger-ai/opengantry@^4

      - name: gantry doctor (readiness)
        run: gantry doctor

      - name: gantry perimeter (CI signature enforcement)
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: gantry perimeter --ci --base-ref "$BASE_SHA"

  msn_commits:
    if: github.event_name == 'pull_request'
    needs: pr_governance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Fetch gxt-bypass git notes
        run: git fetch origin 'refs/notes/*:refs/notes/*' || true

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          # No npm cache: the job installs only the gantry CLI, and an adopter repository may have no lockfile.
          package-manager-cache: false

      - name: Install gantry
        run: npm install -g @jeger-ai/opengantry@^4

      - name: Path-scoped MSN commit subjects
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: gantry ci msn-range --base "$BASE_SHA" --head "$HEAD_SHA"

  mission_verify:
    if: github.event_name == 'pull_request'
    needs: pr_governance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          # No npm cache: the job installs only the gantry CLI, and an adopter repository may have no lockfile.
          package-manager-cache: false

      - name: Install gantry
        run: npm install -g @jeger-ai/opengantry@^4

      - name: Fetch cross-repo mission dependencies
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          json="$(gantry mission changed --base-ref "$BASE_SHA" --head-ref "$HEAD_SHA" --json)" || {
            echo "$json"
            exit 1
          }
          mapfile -t missions < <(
            printf '%s' "$json" | node -e '
              let s = "";
              process.stdin.setEncoding("utf8");
              process.stdin.on("data", (c) => { s += c; });
              process.stdin.on("end", () => {
                const j = JSON.parse(s);
                if (j.status !== "ok") process.exit(1);
                for (const m of j.missions || []) console.log(m);
              });
            '
          )
          if [ ${#missions[@]} -eq 1 ] && [ -z "${missions[0]:-}" ]; then
            missions=()
          fi
          if [ ${#missions[@]} -eq 0 ]; then
            echo "deps fetch: no PR-changed missions"
            exit 0
          fi
          for m in "${missions[@]}"; do
            [ -n "$m" ] || continue
            gantry deps fetch --mission "$m"
          done

      - name: Full verify on PR-changed missions
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: gantry ci verify-missions --base "$BASE_SHA" --head "$HEAD_SHA"
