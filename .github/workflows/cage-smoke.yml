# Cage adoption smoke: built-in protected-set revert/watch/push-guard tests on major OS targets.
name: Cage smoke

on:
  pull_request:
    paths:
      - "src/cli/lib/cage/**"
      - "src/cli/commands/cage.ts"
      - "src/cli/program-cage.ts"
      - "src/cli/cage-bin.ts"
      - "src/cli/tests/cage*.test.ts"
      - "scripts/cage-smoke.sh"
      - ".github/workflows/cage-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install Node deps
        run: npm ci

      - name: Cage smoke
        shell: bash
        run: chmod +x ./scripts/cage-smoke.sh && ./scripts/cage-smoke.sh
